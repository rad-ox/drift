[package]
name = "drift_rust"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
description = "Zero-dependency compile-once Rust test bridge for DRIFT"
license = "MIT"
repository = "https://github.com/rad-ox/drift"

[lib]
name = "drift_rust"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
