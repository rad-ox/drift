drift = "0.3"
id = "item-get"
intent = "Return one item by id without changing any data."

[use]
profile = "http-json@1"

[scope]
surface = "GET /items/{id}"
writes = []
reads = ["items"]
indirect = "none"

[bind]
code = ["src/main/java/example/items/ItemServer.java"]

[cases.found]
at = ["http"]
when.request = "GET /items/1"
then.status = 200
then.name = "lamp"

[cases.not-found]
at = ["http"]
when.request = "GET /items/999"
then.status = 404
then.error = "item not found"

[cases.bad-id]
at = ["http"]
when.request = "GET /items/abc"
then.status = 400
then.error = "id must be a positive integer"

[cases.read-only]
at = ["unit"]
when.request = "GET /items/1"
then.status = 200

