* { box-sizing: border-box; margin: 0; padding: 0; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 3px; }
html, body { height: 100%; }
body {
  overflow: hidden;
  background: var(--bg-page);
  color: var(--ink-primary);
  caret-color: var(--mint);
  font-family: "Segoe UI Variable Text", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

}

.mono { font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }

.ic { flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.ic .ic-fill { fill: currentColor; fill-opacity: 0.32; }
.ic .ic-solid { fill: currentColor; stroke: none; }

/* Shell */
.shell { display: grid; grid-template-columns: minmax(0, 1fr) 336px; grid-template-rows: 52px minmax(0, 1fr) auto; height: 100vh; }
.top { grid-column: 1 / -1; position: relative; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-header); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 6; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand h1 { font-family: "Segoe UI Variable Display", "SF Pro Display", "Aptos Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; font-size: 15px; font-weight: 750; letter-spacing: -0.02em; white-space: nowrap; }
.emblem .em-out { fill: none; stroke: var(--copper); stroke-width: 1.4; }

.emblem .em-core { fill: var(--mint); }
.ref-badge { font-size: 11px; font-weight: 640; letter-spacing: 0.02em; padding: 2px 7px; border-radius: 5px; background: var(--mint-soft); color: var(--mint); white-space: nowrap; }
.ref-badge.whatif { background: var(--amber-soft); color: var(--amber); }
.counts { font-size: 11px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }
.beam { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--hairline-faint); overflow: hidden; }
.beam-fill { height: 100%; background: var(--horizon-beam); transform-origin: left center; }
.beam.busy .beam-fill { animation: beamSweep 1100ms cubic-bezier(0.16, 1, 0.3, 1) infinite; }
@keyframes beamSweep { 0% { transform: translateX(-100%) scaleX(0.35); } 60% { transform: translateX(40%) scaleX(0.7); } 100% { transform: translateX(100%) scaleX(0.35); } }

.mode-seg { display: inline-flex; background: var(--bg-seg-track); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 2.5px; gap: 2px; }
.mode-pill { background: transparent; border: 1px solid transparent; border-radius: 6px; min-height: 28px; padding: 4px 13px; font-size: 12.2px; font-weight: 650; color: var(--ink-body); transition: background 130ms ease, border-color 130ms ease, color 130ms ease; }
.mode-pill:hover { color: var(--ink-primary); }
.mode-pill.active { background: var(--bg-seg-active); border-color: var(--border-seg-active); color: var(--ink-primary); font-weight: 730; box-shadow: inset 0 1px 0 var(--inner-bevel), 0 1px 4px rgba(0, 0, 0, 0.18); }

.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-btn); color: var(--ink-body); font-size: 12.5px; font-weight: 620; white-space: nowrap; box-shadow: inset 0 1px 0 var(--inner-bevel); transition: transform 130ms cubic-bezier(0.16, 1, 0.3, 1), background 130ms ease, border-color 130ms ease, color 130ms ease, opacity 120ms ease; }
.btn:hover:not(:disabled):not(.cta-copper) { background: var(--bg-btn-hover); border-color: var(--copper-border); color: var(--ink-primary); }
.btn:active:not(:disabled) { transform: scale(0.975); }
.btn:disabled { opacity: 0.44; cursor: default; }
.btn.sm { min-height: 28px; padding: 3px 9px; font-size: 12px; }
.btn.icon-only { width: 28px; min-height: 28px; padding: 0; }
.btn.on { background: var(--copper-soft); border-color: var(--copper-border); color: var(--copper); }
.btn:focus:not(:focus-visible), .mode-pill:focus:not(:focus-visible), .row-btn:focus:not(:focus-visible), .chip:focus:not(:focus-visible), .sec-head:focus:not(:focus-visible), .grp-head:focus:not(:focus-visible), .lg-item:focus:not(:focus-visible), .crumb:focus:not(:focus-visible) { outline: none; }
.btn:focus-visible, .mode-pill:focus-visible, .row-btn:focus-visible, .chip:focus-visible, .sec-head:focus-visible, .grp-head:focus-visible, .lg-item:focus-visible, .crumb:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }
.kbd-hint { padding: 1px 5px; border-radius: 4px; font-size: 11px; font-weight: 650; background: rgba(127, 135, 150, 0.18); color: inherit; }
.btn.cta-copper { border: 1px solid transparent; border-radius: 10px; min-height: 36px; padding: 5px 6px 5px 15px; gap: 10px; font-size: 13px; font-weight: 680; letter-spacing: -0.01em; color: #F6F4EE; background-color: #171c25; background-image: var(--copper-cta); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 8px 20px rgba(0, 0, 0, 0.30); overflow: hidden; }
.btn.cta-copper::before { content: ""; position: absolute; top: 0; left: 15%; right: 15%; height: 1px; pointer-events: none; background: linear-gradient(90deg, rgba(232, 167, 109, 0) 0%, rgba(246, 200, 156, 0.72) 36%, rgba(118, 247, 220, 0.68) 66%, rgba(88, 220, 195, 0) 100%); }
.btn.cta-copper:hover:not(:disabled) { background-image: var(--copper-cta-hover); transform: translateY(-1.5px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 10px 24px rgba(0, 0, 0, 0.38); }
.btn.cta-copper .kbd-hint { background: rgba(255, 255, 255, 0.10); }
.cta-socket { width: 24px; height: 24px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; background: linear-gradient(135deg, rgba(232, 167, 109, 0.16) 0%, rgba(88, 220, 195, 0.13) 100%); border: 1px solid rgba(232, 167, 109, 0.34); transition: border-color 150ms ease; }
.btn.cta-copper:hover:not(:disabled) .cta-socket { border-color: rgba(118, 247, 220, 0.54); }
.cta-socket .gate { fill: rgba(232, 167, 109, 0.22); stroke: #E8A76D; stroke-width: 1.25; }
.cta-socket .chev { fill: none; stroke: #F6F4EE; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1); }
.btn.cta-copper:hover:not(:disabled) .chev { transform: translateX(1.6px); }

/* Stage and canvas overlays */
.stage { grid-column: 1; grid-row: 2; position: relative; overflow: hidden; background: var(--bg-stage); min-width: 0; }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
#graph.panning { cursor: grabbing; }
#graph:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: -3px; }
.ov { position: absolute; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 10px; background: var(--bg-pop); border: 1px solid var(--border-card); box-shadow: var(--pop-shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.ov-tl { top: 12px; left: 12px; max-width: calc(100% - 300px); }
.ov-tr { top: 12px; right: 12px; width: 252px; }
.ov-br { right: 12px; bottom: 12px; gap: 3px; }
.ov-bl { position: absolute; z-index: 3; left: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: min(430px, calc(100% - 360px)); pointer-events: none; }
.ov-bl > * { pointer-events: auto; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
.crumb { border: 0; background: transparent; border-radius: 6px; min-height: 28px; padding: 3px 8px; font-size: 12px; font-weight: 620; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.crumb:hover:not([aria-current]) { background: var(--bg-btn-hover); color: var(--ink-primary); }
.crumb[aria-current] { color: var(--ink-primary); cursor: default; }
.crumb-sep { color: var(--ink-muted); flex: none; }
.stepper { display: flex; align-items: center; gap: 3px; padding-left: 7px; margin-left: 2px; border-left: 1px solid var(--hairline-faint); font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; }
.stepper b { min-width: 14px; text-align: center; color: var(--ink-primary); font-weight: 700; }
.search-in { flex: 1; min-width: 0; height: 28px; padding: 0 8px 0 4px; border: 0; background: transparent; font-size: 12.5px; color: var(--ink-primary); outline: none; }
.search-in::placeholder { color: var(--ink-muted); }
.ov-tr:focus-within { border-color: var(--mint-border); box-shadow: 0 0 0 2px var(--mint-soft), var(--pop-shadow); }
.search-ic { margin-left: 6px; color: var(--ink-muted); }
.hits { position: absolute; top: calc(100% + 6px); left: 0; right: 0; padding: 5px; border-radius: 10px; background: var(--bg-pop); border: 1px solid var(--border-card); box-shadow: var(--pop-shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 1px; max-height: min(268px, 46vh); overflow-y: auto; }
.zoom-read { min-width: 50px; font-size: 11.5px; }
.sep-v { width: 1px; align-self: stretch; margin: 3px 2px; background: var(--hairline-faint); }
.fold-note { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; padding: 6px 6px 6px 11px; border-radius: 10px; background: var(--bg-pop); border: 1px solid var(--amber-border); box-shadow: var(--pop-shadow); font-size: 12px; color: var(--ink-body); max-width: 100%; }
.fold-note b { color: var(--amber); font-weight: 700; }
.fold-txt { flex: 1 1 100%; min-width: 0; }
.fold-note .grow { flex: 1; }
.legend { padding: 8px 9px 7px; border-radius: 10px; background: var(--bg-pop); border: 1px solid var(--border-card); box-shadow: var(--pop-shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: 100%; }
.lg-title { font-size: 11px; font-weight: 680; letter-spacing: 0.04em; color: var(--ink-muted); margin-bottom: 4px; }
.lg-grid { display: grid; grid-template-columns: repeat(2, auto); gap: 1px 6px; justify-content: start; }
.lg-item { display: flex; align-items: center; gap: 7px; min-height: 26px; padding: 2px 7px 2px 5px; border: 0; border-radius: 6px; background: transparent; font-size: 11.5px; font-weight: 600; color: var(--ink-body); text-align: left; white-space: nowrap; }
button.lg-item:hover { background: var(--bg-btn-hover); color: var(--ink-primary); }
.lg-item[aria-pressed="false"] { color: var(--ink-muted); text-decoration: line-through; }
.lg-item[aria-pressed="false"] svg { opacity: 0.3; }
.lg-item .n { color: var(--ink-muted); font-weight: 500; }
.lg-dot { width: 3px; height: 13px; border-radius: 2px; margin: 0 4px 0 3px; flex: none; }
.lg-dot.tone-mint { background: var(--mint); } .lg-dot.tone-copper { background: var(--copper); } .lg-dot.tone-coral { background: var(--coral); }
.lg-dot.tone-amber { background: linear-gradient(180deg, var(--amber) 0 4px, transparent 4px 6.5px, var(--amber) 6.5px 10.5px, transparent 10.5px 13px); }
.lg-sep { grid-column: 1 / -1; height: 1px; margin: 4px 0 3px; background: var(--hairline-faint); }
#themeIcon { display: inline-flex; }
.cue { position: absolute; z-index: 2; gap: 4px; background: var(--bg-pop); box-shadow: var(--pop-shadow); }
.cue-r { right: 10px; } .cue-l { left: 10px; }
.dock-cue { gap: 3px; padding: 3px 7px; }
.dock-cue.up svg { transform: rotate(-90deg); } .dock-cue.down svg { transform: rotate(90deg); }
.cue-r.p2, .cue-l.p2 { top: 20%; } .cue-r.p3, .cue-l.p3 { top: 30%; } .cue-r.p4, .cue-l.p4 { top: 40%; } .cue-r.p5, .cue-l.p5 { top: 50%; } .cue-r.p6, .cue-l.p6 { top: 60%; } .cue-r.p7, .cue-l.p7 { top: 70%; } .cue-r.p8, .cue-l.p8 { top: 80%; }
.cue-l svg { transform: rotate(180deg); }
.stage-msg { position: absolute; z-index: 2; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(460px, calc(100% - 48px)); display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; }

/* Graph: nodes */
.dots circle { fill: var(--dot-grid); }
.beam-a { stop-color: var(--beam-a); }
.beam-b { stop-color: var(--beam-b); }
.node { cursor: pointer; outline: none; --n-accent: var(--mint); color: var(--n-accent); transition: opacity 140ms ease; }
.node.s-draft { --n-accent: var(--copper); }
.node.s-assumed, .node.s-whatif { --n-accent: var(--amber); }
.node.s-finding { --n-accent: var(--coral); }

/* Dimming: hover or selection isolates a neighbourhood, a walk isolates its route. */
.g-root.has-q .node:not(.q-hit) { opacity: 0.32; }

.g-root.has-hl .node:not(.hl), .g-root.has-hl .edge:not(.hl), .g-root.has-hl .e-label.auto:not(.hl), .g-root.has-hl .e-flag:not(.hl) { opacity: 0.22; }
.g-root.has-hl .node.hl, .g-root.has-hl .edge.hl, .g-root.has-hl .e-label.hl, .g-root.has-hl .e-flag.hl, .g-root.has-hl .node.sel, .g-root.has-hl .edge.sel { opacity: 1; }

.e-label, .e-flag { transition: opacity 140ms ease; }

.edge.walk .edge-path { stroke: var(--mint-bright); stroke-width: 2.4; stroke-dasharray: none; marker-end: url(#mk-bright); }

.w-badge rect { fill: var(--label-bg); stroke: var(--mint-bright); stroke-width: 1.5; }
.w-badge.wv-unknown rect { stroke: var(--amber); } .w-badge.wv-refuted rect { stroke: var(--coral); }
.w-badge text { font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 800; fill: var(--ink-primary); }

.w-alt text { font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; font-weight: 700; fill: var(--ink-body); }
.w-alt:hover rect { stroke: var(--copper); stroke-dasharray: none; }
.w-alt:focus-visible rect { stroke: var(--mint-bright); stroke-width: 2; stroke-dasharray: none; }
.w-alt:focus { outline: none; }
.orb { fill: var(--mint-bright); pointer-events: none; }
.orb-halo { fill: var(--mint-bright); opacity: 0.22; pointer-events: none; }

/* Inspector rail */
.rail { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; min-height: 0; color: var(--ink-primary); background: radial-gradient(circle at 82% 4%, rgba(232, 167, 109, 0.10) 0%, rgba(88, 220, 195, 0.045) 42%, rgba(13, 16, 22, 0) 72%), linear-gradient(180deg, #151922 0%, #0D1016 100%); border-left: 1px solid rgba(255, 255, 255, 0.075); }

.i-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 5px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 640; white-space: nowrap; background: rgba(255, 255, 255, 0.06); color: var(--ink-body); }

.leg .ic { margin: 0 5px; vertical-align: -1.5px; color: var(--ink-muted); }

.alt-grp { border-top: 0; margin: -6px 0 0 25px; }

.grp-body.alts { flex-direction: row; flex-wrap: wrap; gap: 4px; max-height: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; padding: 3px 9px; border-radius: 6px; border: 1px dashed var(--border-card); background: transparent; font-size: 11px; font-weight: 600; color: var(--ink-body); max-width: 100%; }
.chip:hover { border-style: solid; border-color: var(--copper-border); color: var(--ink-primary); }
.rail-foot { padding: 8px 14px 10px; font-size: 11.5px; color: var(--ink-muted); display: flex; flex-direction: column; gap: 4px; }

.limits:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }
.limits .chev { margin-top: 3px; transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1); }
.limits.open .chev { transform: rotate(90deg); }
.lim-txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.limits.open .lim-txt { display: block; max-height: 120px; overflow-y: auto; }

/* Dock */
.dock { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 10px 16px; background: var(--bg-header); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--border-subtle); z-index: 6; }
.tray { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 44%; overflow-x: auto; padding: 2px; }
.tray-label { font-size: 11px; font-weight: 680; letter-spacing: 0.04em; color: var(--ink-muted); flex: none; }
.tray-hint { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
.pin-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 5px 3px 9px; border-radius: 6px; border: 1px solid var(--copper-border); background: var(--copper-soft); font-size: 11.5px; font-weight: 640; color: var(--ink-primary); white-space: nowrap; flex: none; }
.pin-chip:hover { border-color: var(--copper); }
.pin-chip:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }
.pin-chip .h { color: var(--copper); }

.field-in { flex: 1; min-width: 150px; height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-card); background: var(--bg-input); font-size: 13px; color: var(--ink-primary); transition: border-color 130ms ease, box-shadow 130ms ease; }
.field-in::placeholder { color: var(--ink-muted); }
.field-in:focus { outline: none; border-color: var(--mint-border); box-shadow: 0 0 0 2px var(--mint-soft); }

@media (max-width: 1080px) {
  .shell { grid-template-columns: minmax(0, 1fr) 300px; }
  .ov-br .lbl { display: none; }
}
@media (max-width: 860px) {
  body { overflow-y: auto; }
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px 62vh auto auto; height: auto; min-height: 100vh; }
  .top { padding: 0 12px; gap: 8px; }

}

}
@media (forced-colors: active) {

}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <svg class="emblem" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path class="em-out" d="M11 1.6 20.4 11 11 20.4 1.6 11Z"/><path class="em-in" d="M11 6.2 15.8 11 11 15.8 6.2 11Z"/><circle class="em-core" cx="11" cy="11" r="1.7"/></svg>
      <h1>DRIFT Flow Explorer</h1>
    </div>
    <span id="refBadge" class="ref-badge mono" title="Map reference pinned when you send focus">map</span>
    <span id="countsBadge" class="counts mono"></span>
    <span class="spacer"></span>
    <div class="mode-seg" id="viewSeg" role="group" aria-label="Map view">
      <button type="button" class="mode-pill" data-view="flow" aria-pressed="false">Flow</button>
      <button type="button" class="mode-pill" data-view="cases" aria-pressed="false">Cases</button>
      <button type="button" class="mode-pill" data-view="state" aria-pressed="false">State</button>
    </div>
    <button type="button" id="copyMermaidBtn" class="btn" title="Copy this view as a Mermaid diagram" aria-label="Copia Mermaid">
      <svg class="ic" width="14" height="14" viewBox="0 0 18 18" aria-hidden="true"><rect x="6.2" y="6.2" width="9" height="9" rx="2"/><path d="M11.8 6.2V4.6a1.8 1.8 0 0 0-1.8-1.8H4.6a1.8 1.8 0 0 0-1.8 1.8V10a1.8 1.8 0 0 0 1.8 1.8h1.6"/></svg>
      <span class="lbl">Copia Mermaid</span>
    </button>
    <button type="button" id="themeBtn" class="btn" title="Switch theme" aria-label="Switch theme">
      <span id="themeIcon"></span><span id="themeLabel" class="lbl">Dark</span>
    </button>
    <div class="beam" id="beam" aria-hidden="true"><div class="beam-fill"></div></div>

  function renderLegend() {

  /* Search within the current view */

    clear(box);

    for (const n of S.L.order) {
      const nd = n.nd;
      if (`${nd.h} ${nd.id || ""} ${nd.label || ""} ${nd.kind || ""}`.toLowerCase().includes(q)) S.hits.push(n);
    }
    S.hitIdx = 0;

    if (!S.hits.length) box.appendChild(h("div", "empty", "No node in this view matches. Folded nodes are not searched."));

  /* Focus tray */
  function pinLabel(handle) {

  function syncPins() {

  }
  function renderTray() {

  /* Walk: stepper in the rail, numbered route on the map */
  const VERDICT_TONE = { compatible: "mint", unknown: "amber", refuted: "coral" };
  const verdictClass = (v) => "wv-" + (Object.prototype.hasOwnProperty.call(VERDICT_TONE, v) ? v : "unknown");
  const endpoint = (p) => (p ? `${p.id || p.h}#${p.case}` : "");
  const walkLit = [];
  function walkNodes(w) {
    const need = new Set();
    for (const hop of w.hops || []) {
      for (const hh of [hop.from && hop.from.h, hop.resource, hop.to && hop.to.h]) if (hh) need.add(String(hh));
      for (const alt of hop.alternatives || []) if (alt && alt.to) need.add(String(alt.to).split("#")[0]);
    }
    return need;
  }
  function uniqueAlts(hop) {
    const seen = new Set(), out = [];
    for (const alt of hop.alternatives || []) {
      if (!alt || !alt.to || seen.has(alt.to)) continue;
      seen.add(alt.to);
      out.push(alt);
    }
    return out;
  }
  function walkOnMap() {
    const W = S.walk;
    return !!(W && S.L && S.doc && S.nav.view === "flow" && W.doc.map_ref === S.doc.map_ref);
  }
  function replayVia(hop, altTo) {
    const before = (S.walk.doc.hops || []).filter((x) => x.index < hop.index).map((x) => `${x.to.h}#${x.to.case}`);
    return before.concat([String(altTo)]);
  }
  function applyWalk() {
    const layer = $("walkLayer"), root = $("viewport");
    clear(layer);
    for (const [el, classes] of walkLit) el.classList.remove(...classes);
    walkLit.length = 0;
    if (!walkOnMap()) { root.classList.remove("has-walk"); return; }
    const W = S.walk;
    const mark = (el, ...classes) => { el.classList.add(...classes); walkLit.push([el, classes]); };
    const route = [];
    let total = 0, any = false;
    for (const hop of W.doc.hops || []) {
      const on = !W.hop || W.hop === hop.index;
      const vc = verdictClass(hop.verdict);
      for (const nh of [hop.from && hop.from.h, hop.resource, hop.to && hop.to.h]) {
        const nr = els.nodes.get(nh);
        if (nr) { mark(nr.g, "walk", ...(on ? ["walk-on"] : [])); any = true; }
      }
      for (const eh of [hop.write, hop.read]) {
        const er = els.edges.get(eh);
        if (!er || S.hidden.has(er.kind) || !er.mid) continue;
        mark(er.g, "walk", vc, ...(on ? ["walk-on"] : []));
        any = true;
        const b = s("g", { transform: `translate(${r1(er.mid.x)} ${r1(er.mid.y)})` }, `w-badge ${vc}` + (on ? " on" : ""));
        b.appendChild(s("rect", { x: -7.5, y: -7.5, width: 15, height: 15, rx: 3, transform: "rotate(45)" }));
        const t = s("text", { y: 3.7, "text-anchor": "middle" });
        t.textContent = String(hop.index);
        b.appendChild(t);
        layer.appendChild(b);
        if (on) { route.push(er.r.d); total += er.len || 0; }
      }
      const written = new Set([hop.resource]);
      const fromNode = S.L.nodes.get(hop.from && hop.from.h);
      for (const x of (fromNode && fromNode.outs) || []) if (x.e.kind === "writes") written.add(x.b.h);
      for (const alt of uniqueAlts(hop)) {
        const altH = String(alt.to).split("#")[0];
        const nr = els.nodes.get(altH);
        if (nr) mark(nr.g, "walk-alt");
        const r = S.L.edges.find((x) => x.e.kind === "reads" && x.b.h === altH && x.a.h === hop.resource) || S.L.edges.find((x) => x.e.kind === "reads" && x.b.h === altH && written.has(x.a.h));
        const er = r && els.edges.get(r.h);
        if (!er || S.hidden.has(er.kind) || er.g.classList.contains("walk")) continue;
        mark(er.g, "walk-alt");
        const p = er.path.getPointAtLength((er.len || 0) * 0.62);
        const g = s("g", { transform: `translate(${r1(p.x)} ${r1(p.y)})`, tabindex: 0, role: "button" }, "w-alt");
        g.setAttribute("aria-label", `Replay the walk through alternative ${alt.to}, ${alt.verdict}`);
        const tip = s("title");
        tip.textContent = `Alternative for hop ${hop.index}: ${alt.to} (${alt.verdict}). Click to replay through it.`;
        g.appendChild(tip);
        g.appendChild(s("rect", { x: -14, y: -8.5, width: 28, height: 17, rx: 5 }));
        const t = s("text", { y: 3.5, "text-anchor": "middle" });
        t.textContent = "alt";
        g.appendChild(t);
        const go = (ev) => { ev.stopPropagation(); runWalk(W.from, replayVia(hop, alt.to)); };
        g.addEventListener("click", go);
        g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(ev); } });
        layer.appendChild(g);
      }
    }
    root.classList.toggle("has-walk", any);
    if (route.length && !reduced.matches) {
      const orb = s("g");
      orb.appendChild(s("circle", { r: 7.5 }, "orb-halo"));
      orb.appendChild(s("circle", { r: 3.4 }, "orb"));
      orb.appendChild(s("animateMotion", { path: route.join(""), dur: clamp(total / 170, 1.5, 7).toFixed(2) + "s", repeatCount: "indefinite", calcMode: "linear" }));
      layer.appendChild(orb);
    }
  }
  function focusHop(index) {

    renderWalk();
    applyWalk();
    if (!walkOnMap()) return;
    const list = [];
    for (const hop of W.doc.hops || []) {
      if (W.hop && hop.index !== W.hop) continue;
      for (const nh of [hop.from && hop.from.h, hop.resource, hop.to && hop.to.h]) { const n = S.L.nodes.get(nh); if (n) list.push(n); }
    }
    const box = boxOfNodes(list);

  }
  function leg(cls, from, to) {

  function resourceName(handle) {

  function renderWalk() {
    const box = $("walkBody"), sum = $("walkSum");
    clear(box);
    sum.textContent = "";
    const W = S.walk;
    if (!W) {
      box.appendChild(h("p", "empty", "Select a contract in Flow, then choose a case under \u201cWalk from a case\u201d to replay how its outcome may reach downstream contracts."));
      return;
    }
    const w = W.doc, hops = w.hops || [];
    sum.textContent = `${w.verdict} \u00b7 ${plural(hops.length, "hop")}`;
    const head = h("div");
    head.appendChild(leg("i-title mono", String((w.route && w.route.from) || W.from), String((w.state && w.state.at) || "?")));
    const sub = h("div", "i-sub");
    sub.appendChild(h("span", "badge " + (VERDICT_TONE[w.verdict] || ""), String(w.verdict)));
    sub.appendChild(h("span", "badge", `outcome ${w.outcome}`));
    sub.appendChild(h("span", "badge", `${w.precision} precision`));
    if (w.hypothetical) sub.appendChild(h("span", "badge amber", "what-if"));
    head.appendChild(sub);
    box.appendChild(head);
    const acts = h("div", "acts");
    if (W.hop) acts.appendChild(actBtn("All hops", "play", () => focusHop(W.hop)));
    const copy = actBtn("Seq .mmd", "copy", copyWalk);
    copy.title = "Copy this walk as a Mermaid sequence diagram";
    acts.appendChild(copy);
    acts.appendChild(actBtn("Clear", "close", () => { S.walk = null; renderWalk(); applyWalk(); }));
    box.appendChild(acts);
    if (!walkOnMap()) box.appendChild(h("p", "empty", S.nav.view === "flow" ? "The map changed since this walk ran, so it is not drawn on the canvas." : "Switch to Flow to see this route on the map."));
    if (!hops.length) box.appendChild(h("p", "empty", "No downstream hop: this case does not feed another contract."));
    for (const hop of hops) {
      const b = h("button", `hop ${verdictClass(hop.verdict)}` + (W.hop === hop.index ? " active" : ""));
      b.type = "button";
      b.setAttribute("aria-pressed", W.hop === hop.index ? "true" : "false");
      b.title = "Highlight this hop on the map";
      const top = h("div", "hop-top");
      const num = h("span", "hop-n mono");
      num.appendChild(h("span", null, String(hop.index)));
      top.appendChild(num);
      top.appendChild(leg("hop-route mono", endpoint(hop.from), endpoint(hop.to)));
      top.appendChild(h("span", "badge " + (VERDICT_TONE[hop.verdict] || ""), String(hop.verdict)));
      b.appendChild(top);
      const basis = (hop.basis || []).map((x) => `${x.pointer} ${x.status}` + (x.witness != null && x.witness !== "" ? ` (witness ${x.witness})` : "")).join(", ");
      b.appendChild(h("div", "hop-basis mono", `via ${resourceName(hop.resource)}` + (basis ? ` \u00b7 ${basis}` : "")));
      b.addEventListener("click", () => focusHop(hop.index));
      box.appendChild(b);
      const alts = uniqueAlts(hop);
      if (alts.length) {
        const grp = group(plural(alts.length, "alternative"), null, alts.length <= 2);
        grp.g.classList.add("alt-grp");
        grp.body.classList.add("alts");
        for (const alt of alts) {
          const c = h("button", "chip mono", `${alt.to} \u00b7 ${alt.verdict}`);
          c.type = "button";
          c.title = "Replay the walk through this alternative";
          c.addEventListener("click", () => runWalk(W.from, replayVia(hop, alt.to)));
          grp.body.appendChild(c);
        }
        box.appendChild(grp.g);
      }
    }
    if (w.claim_limits && w.claim_limits.length) box.appendChild(h("p", "empty", String(w.claim_limits[0])));
  }
  async function runWalk(from, via) {
    say(`Walking from ${from}\u2026`);
    try {
      const w = await (await apiPost("/api/walk", { from, via, max_hops: 8 })).json();
      S.walk = { from, via, doc: w, hop: 0 };
      openSection("secWalk", true);
      openSection("secInspect", false);
      say("");
      if (S.nav.view === "flow" && S.doc && w.map_ref === S.doc.map_ref) {
        const need = [...walkNodes(w)];
        if (need.length && need.some((hh) => !S.L || !S.L.nodes.has(hh))) {
          await navigate({ view: "flow", focus: need, depth: 0, label: `Walk ${(w.route && w.route.from) || from}` }, true);
          return;
        }
      }
      renderWalk();
      applyWalk();
      applyHighlight();
    } catch (e) {
      say("Walk unavailable: " + e.message, true);
    }
  }
  async function copyText(txt, what) {
    if (!navigator.clipboard) { say("Clipboard is unavailable in this window.", true); return; }
    await navigator.clipboard.writeText(txt);
    say(`${what} copied (${txt.length} chars).`);
  }
  async function copyWalk() {
    const W = S.walk;
    if (!W) return;
    try { await copyText(await (await apiPost("/api/walk", { from: W.from, via: W.via, format: "mermaid" })).text(), "Walk sequenceDiagram"); }
    catch (e) { say("Walk copy failed: " + e.message, true); }
  }

  function renderAll() {
    renderGraph();
    renderHeader();
    renderCrumbs();
    renderFold();
    renderLegend();
    renderInspector();
    renderWalk();
    applyWalk();
    applyHighlight();
    runSearch();
  }

  /* Focus submission and window lifecycle */
  async function submitFocus() {
    const handles = Array.from(S.pins.keys());
    if (!handles.length && S.sel) handles.push(S.sel.h);
    if (!handles.length) { say("Pin or select at least one node or link first.", true); return; }
    try {
      await apiPost("/api/focus", { handles, map_ref: S.doc ? S.doc.map_ref : "", view: S.nav.view, question: $("questionInput").value });
      say("Focus sent. You can close this window.");
      window.close();
    } catch (e) { say("Focus error: " + e.message, true); }
  }
  async function closeWin() {
    try { await apiPost("/api/closed", {}); } catch (_) { /* server already gone */ }
    say("Explorer closed. You can close this window.");
    window.close();
  }
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("themeLabel").textContent = t === "light" ? "Light" : "Dark";
    const host = $("themeIcon");
    clear(host);
    host.appendChild(icon(t === "light" ? "sun" : "moon", 14));
  }

  function init() {
    buildMarkers();
    bindCanvas();
    bindSearch();
    setTheme(window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    $("themeBtn").addEventListener("click", () => setTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"));
    for (const b of $("viewSeg").children) b.addEventListener("click", () => { if (b.dataset.view !== S.nav.view) switchView(b.dataset.view); });
    $("backBtn").addEventListener("click", back);
    $("pagePrev").addEventListener("click", () => page(-1));
    $("pageNext").addEventListener("click", () => page(1));
    /* A deeper view that folds every link under the node budget is worse than the one it
       replaces: step back and say why instead of landing on an unlinked wall. */
    const setDepth = async (d) => {
      const prev = S.nav, hadLinks = !!S.L && S.L.edges.length > 0, from = (S.doc && S.doc.view && S.doc.view.depth) || 0;
      S.nav = Object.assign({}, S.nav, { depth: clamp(d, 0, 4), skip: 0 });
      if (!(await load()) || d <= from || !hadLinks || !S.doc) return;
      const om = S.doc.omitted || {};
      if (!om.edges || om.edges.shown > 0 || !(om.edges.folded > 0)) return;
      const total = om.nodes ? om.nodes.total : 0, budget = (S.doc.view && S.doc.view.max_nodes) || 40;
      S.nav = prev;
      await load();
      say(`Depth ${d} spans ${total} nodes; inside the ${budget}-node budget every link folds, so the view stays at depth ${from}. Open a neighbour instead.`);
    };
    $("hubBtn").addEventListener("click", () => { if (S.L && S.L.hub) explore(S.L.hub); });
    $("budgetBtn").addEventListener("click", () => { S.budget = S.budget ? null : 128; S.nav = Object.assign({}, S.nav, { skip: 0 }); load(); });
    $("limits").addEventListener("click", () => {
      const open = $("limits").classList.toggle("open");
      $("limits").setAttribute("aria-expanded", open ? "true" : "false");
    });
    $("depthDown").addEventListener("click", () => setDepth(((S.doc && S.doc.view && S.doc.view.depth) || 0) - 1));
    $("depthUp").addEventListener("click", () => setDepth(((S.doc && S.doc.view && S.doc.view.depth) || 0) + 1));
    $("legendBtn").addEventListener("click", () => {
      const btn = $("legendBtn"), on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.classList.toggle("on", on);
      renderLegend();
    });
    $("headInspect").addEventListener("click", () => openSection("secInspect"));
    $("headWalk").addEventListener("click", () => openSection("secWalk"));
    $("copyMermaidBtn").addEventListener("click", async () => {
      try { await copyText(await (await apiGet("/api/mermaid?" + queryParams())).text(), "Mermaid"); }
      catch (e) { say("Copy failed: " + e.message, true); }
    });
    $("submitBtn").addEventListener("click", submitFocus);
    $("closeBtn").addEventListener("click", closeWin);
    window.addEventListener("keydown", (e) => {
      const inField = e.target instanceof HTMLInputElement;
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (!e.repeat) submitFocus(); return; }
      if (e.key === "Escape") {
        e.preventDefault();
        const input = $("searchInput");
        if (document.activeElement === input || input.value) { input.value = ""; runSearch(); input.blur(); return; }
        if (inField) { e.target.blur(); return; }
        closeWin();
        return;
      }
      if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === "/") { e.preventDefault(); $("searchInput").focus(); }
      else if (e.key === "0") fit(false);
      else if (e.key === "+" || e.key === "=") zoomCenter(1.25);
      else if (e.key === "-") zoomCenter(0.8);
    });
    reduced.addEventListener("change", applyWalk);
    renderTray();
    renderInspector();
    renderWalk();
    renderCrumbs();
    load();
  }
  init();
})();
</script>
</body>
</html>
