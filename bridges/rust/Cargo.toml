[package]
name = "drift_rust"
version = "0.11.0"
edition = "2021"
rust-version = "1.80"
description = "Zero-dependency compile-once Rust test bridge for DRIFT"
license = "MIT"
repository = "https://github.com/rad-ox/drift"

[lib]
name = "drift_rust"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
