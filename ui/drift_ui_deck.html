  async function submitGesture(action) {
    if (submitting) return;
    submitting = true;
    syncFooter();
    if (action === "approve") {
      const sr = document.getElementById("shockRing1");
      if (sr) sr.classList.add("fire");
      await new Promise(r => setTimeout(r, 210));
    }
    const sels = cards.map((c, i) => ({
      contract_id: c.contract_id || "",
      card_kind: c.card_kind || "",
      card_id: c.card_id || "",
      selected_pick: c.card_kind === "question" ? "" : (picks[i] || ""),
      answer: c.card_kind === "question" ? (answers[i] || "").trim() : ""
    }));
    const isV2 = REQ.schema === "drift.ui-request/2";
    const payload = {
      schema: isV2 ? "drift.ui-gesture/2" : "drift.ui-gesture/1",
      request_id: REQ.request_id || "",
      action: action,
      confirmed_review_ref: action === "approve" ? (REQ.review_ref || "") : "",
      confirmed_owner: ownerVal.trim(),
      note: (changeOpen && noteVal.trim()) ? noteVal.trim() : "",
      selections: sels
    };
    if (isV2) {
      payload.confirmed_packet_ref = action === "approve" ? (REQ.packet_ref || "") : "";
      payload.confirmed_groups = [];
    }
    try {
      const res = await fetch("/api/gesture", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Drift-Token": CSRF },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        document.body.textContent = "";
        const msg = el("div", "", "Returning to DRIFT…");
        msg.style.color = "var(--ink-body)"; msg.style.fontWeight = "700";
        document.body.appendChild(msg);
        setTimeout(() => { try { window.close(); } catch (_) {} }, 80);
        return;
      }
    } catch (_) {}
    submitting = false;
    rearm();
  }

  function setMoreMenuOpen(open) {
    const menu = document.getElementById("moreMenu");
    const mBtn = document.getElementById("moreBtn");
    menu.classList.toggle("open", Boolean(open));
    mBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  function focusActiveStepHeading() {
    const h = document.getElementById("activeAskHeading");
    if (h) { try { h.focus({ preventScroll: true }); } catch (_) { h.focus(); } }
  }

  document.getElementById("modeDecideBtn").addEventListener("click", () => { if (specOpen) setSpec(false); });
  document.getElementById("modeSpecBtn").addEventListener("click", () => { if (!specOpen) setSpec(true); });
  document.querySelector(".mode-seg").addEventListener("keydown", ev => {
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
    ev.preventDefault();
    ev.stopPropagation();
    const nextSpec = !specOpen;
    setSpec(nextSpec);
    document.getElementById(nextSpec ? "modeSpecBtn" : "modeDecideBtn").focus();
  });

  document.getElementById("termOnceBtn").addEventListener("click", () => submitGesture("use_terminal_once"));
  document.getElementById("alwaysTermBtn").addEventListener("click", () => submitGesture("disable_ui"));
  document.getElementById("quickThemeBtn").addEventListener("click", toggleDirectTheme);
  document.getElementById("cycleThemeBtn").addEventListener("click", () => { toggleAutoTheme(); setMoreMenuOpen(false); });
  document.getElementById("closeBtn").addEventListener("click", () => { if (armed) submitGesture("cancel"); });
  document.getElementById("moreBtn").addEventListener("click", e => {
    e.stopPropagation();
    const willOpen = !document.getElementById("moreMenu").classList.contains("open");
    setMoreMenuOpen(willOpen);
    if (willOpen) document.getElementById("cycleThemeBtn").focus();
  });
  document.getElementById("moreMenu").addEventListener("keydown", ev => {
    if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
    ev.preventDefault();
    const items = [document.getElementById("cycleThemeBtn"), document.getElementById("alwaysTermBtn")];
    const idx = items.indexOf(document.activeElement);
    items[(idx + 1) % items.length].focus();
  });
  document.addEventListener("click", () => setMoreMenuOpen(false));
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.addEventListener("click", () => { tabIdx = Number(b.dataset.tab) || 0; renderSpec(); });
    b.addEventListener("keydown", ev => {
      if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
      ev.preventDefault();
      ev.stopPropagation();
      tabIdx = ev.key === "ArrowRight" ? ((tabIdx + 1) % 3) : ((tabIdx + 2) % 3);
      renderSpec();
      const targetTab = document.getElementById("specTab" + tabIdx);
      if (targetTab) targetTab.focus();
    });
  });

  document.getElementById("backBtn").addEventListener("click", ev => {
    if (specOpen) { setSpec(false); return; }
    if (stepIdx > 0) {
      stepIdx--;
      rearm();
      renderAll(true);
      if (ev.detail === 0) focusActiveStepHeading();
      announce("Step " + (stepIdx + 1) + " of " + totalSteps());
    }
  });
  document.getElementById("primaryBtn").addEventListener("click", ev => {
    if (specOpen) { setSpec(false); return; }
    if (!armed || !currentReady()) return;
    if (stepIdx < cards.length) {
      reviewedSteps.add(stepIdx);
      stepIdx++;
      rearm();
      renderAll(true);
      if (ev.detail === 0) focusActiveStepHeading();
      announce(stepIdx < cards.length ? ("Step " + (stepIdx + 1) + " of " + totalSteps()) : "Final summary ready for approval");
      return;
    }
    const amend = hasAmendments() || !REQ.can_seal_directly || !REQ.review_ref;
    submitGesture(amend ? "amend" : "approve");
  });

  if (window.matchMedia) {
    try { window.matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", syncReducedMotionSvgs); } catch (_) {}
  }
  document.addEventListener("mousemove", pingActivity);
  window.addEventListener("focus", rearm);
  document.addEventListener("keydown", e => {
    pingActivity();
    const tag = e.target && e.target.tagName;
    const inText = (tag === "INPUT" && e.target.type !== "radio") || tag === "TEXTAREA";
    const onButtonOrDisclosure = tag === "BUTTON" || (e.target && e.target.closest && e.target.closest("summary"));
    const inRadioOrTabs = Boolean(e.target && e.target.closest && e.target.closest('[role="radiogroup"], [role="tablist"], [role="menu"]'));

    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      if (e.repeat || !armed) return;
      if (specOpen) setSpec(false);
      if (stepIdx < cards.length) {
        if (allCardsReady()) {
          for (let k = 0; k < cards.length; k++) reviewedSteps.add(k);
          stepIdx = cards.length;
          rearm();
          renderAll(true);
          focusActiveStepHeading();
          announce("Final summary ready for approval");
        }
        return;
      }
      if (currentReady()) {
        const amend = hasAmendments() || !REQ.can_seal_directly || !REQ.review_ref;
        submitGesture(amend ? "amend" : "approve");
      }
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      if (e.repeat) return;
      if (document.getElementById("moreMenu").classList.contains("open")) {
        setMoreMenuOpen(false);
        document.getElementById("moreBtn").focus();
        return;
      }
      if (specOpen) { setSpec(false); document.getElementById("modeDecideBtn").focus(); return; }
      if (armed) submitGesture("cancel");
      return;
    }
    if (inText) return;
    if (e.repeat || !armed) return;
    if (onButtonOrDisclosure && (e.key === "Enter" || e.key === " ")) return;
    if (e.key === " " && !(tag === "INPUT" && e.target.type === "radio")) { e.preventDefault(); setSpec(!specOpen); return; }
    if (specOpen) return;
    if (!inRadioOrTabs && e.key === "ArrowLeft" && stepIdx > 0) {
      e.preventDefault();
      stepIdx--;
      rearm();
      renderAll(true);
      focusActiveStepHeading();
      announce("Step " + (stepIdx + 1) + " of " + totalSteps());
      return;
    }
    if (!inRadioOrTabs && e.key === "ArrowRight" && stepIdx < cards.length && currentReady()) {
      e.preventDefault();
      reviewedSteps.add(stepIdx);
      stepIdx++;
      rearm();
      renderAll(true);
      focusActiveStepHeading();
      announce(stepIdx < cards.length ? ("Step " + (stepIdx + 1) + " of " + totalSteps()) : "Final summary ready for approval");
      return;
    }
    if (e.key === "Enter" && stepIdx < cards.length && currentReady()) {
      e.preventDefault();
      reviewedSteps.add(stepIdx);
      stepIdx++;
      rearm();
      renderAll(true);
      focusActiveStepHeading();
      announce(stepIdx < cards.length ? ("Step " + (stepIdx + 1) + " of " + totalSteps()) : "Final summary ready for approval");
      return;
    }
    if (stepIdx < cards.length && !e.ctrlKey && !e.metaKey && !e.altKey && e.key >= "1" && e.key <= "9") {
      const oi = Number(e.key) - 1;
      const opts = (cards[stepIdx] && cards[stepIdx].options) || [];
      if (oi < opts.length) {
        picks[stepIdx] = opts[oi].id;
        justLockedKey = stepIdx + ":" + opts[oi].id;
        reviewedSteps.add(stepIdx);
        syncSpinePicksInPlace();
        renderStage(false);
        syncFooter();
        announce("Selected option " + (oi + 1) + ": " + opts[oi].id);
      }
    }
  });

  setInterval(() => {
    if (!submitting) fetch("/api/heartbeat", { method: "POST", headers: { "X-Drift-Token": CSRF } }).catch(() => {});
  }, 2000);
  window.addEventListener("pagehide", () => {
    if (!submitting && navigator.sendBeacon) navigator.sendBeacon("/api/closed?t=" + encodeURIComponent(CSRF), "");
  });

  rearm();
  renderAll(true);
})();
</script>
</body>
</html>
