  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: rgba(88, 220, 195, 0.24); color: var(--ink-primary); }
  a, button { text-underline-offset: 3px; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  body {
    height: 100vh;
    overflow: hidden;
    background: var(--bg-page);
    color: var(--ink-primary);
    caret-color: var(--mint);
    font-family: "Segoe UI Variable Text", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.48;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }

  .display-voice {
    font-family: "Segoe UI Variable Display", "SF Pro Display", "Aptos Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
  }

  .mono {
    font-family: "Cascadia Mono", "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  * { scrollbar-width: thin; scrollbar-color: var(--border-card) transparent; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 3px; }

  @keyframes chassisArrive {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes stageReveal {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes sheenSweep {
    from { transform: translateX(-160px); opacity: 0.9; }
    to { transform: translateX(640px); opacity: 0; }
  }
  @keyframes sealShockwave {
    from { transform: scale(0.76); opacity: 0.92; }
    to { transform: scale(1.92); opacity: 0; }
  }

  /* Atmospheric 2-Column DRIFT Observatory Shell */
  .dossier-shell {
    width: 100%;
    max-width: 1140px;
    height: min(800px, calc(100vh - 36px));
    min-height: 560px;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    border-radius: 13px;
    background: var(--bg-stage-solid);
    box-shadow: var(--win-shadow);
    position: relative;
    overflow: hidden;
    animation: chassisArrive 240ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  .dossier-shell::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 13px;
    padding: 1.2px;
    background: var(--rim-grad);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 5;
  }
  .dossier-shell::before {
    content: "";
    position: absolute;
    top: 0;
    left: 18px;
    right: 18px;
    height: 1px;
    background: var(--specular-top);
    pointer-events: none;
    z-index: 4;
  }

  /* Left Basalt-Obsidian Living Wave Spine (Boxless & Atmospheric) */
  .wave-spine {
    background-color: #12161E;
    background-image: var(--bg-spine);
    color: var(--ink-spine);
    border-right: 1px solid var(--border-spine);
    padding: 20px 18px 16px;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    gap: 14px;
    min-height: 0;
    min-width: 0;
  }

  .brand-head {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .proj-meta { min-width: 0; flex: 1; }
  .proj-name {
    font-size: 16.5px;
    font-weight: 750;
    letter-spacing: -0.02em;
    color: var(--ink-spine);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .proj-sub {
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-spine-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ws-strata {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    margin-top: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-spine);
  }
  .strata-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--ink-spine-sub);
    font-size: 11.5px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Sleek Boxless Horizon Readiness Meter */
  .readiness-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 2px;
  }
  .readiness-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: 0.04em;
    color: var(--ink-spine-dim);
  }
  .readiness-count { color: var(--rail-mint); font-weight: 700; }
  .readiness-cells {
    display: flex;
    gap: 5px;
    height: 3.5px;
  }
  .r-cell {
    flex: 1;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.09);
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .r-cell.done { background: var(--rail-mint); }
  .r-cell.default-ready { background: rgba(88, 220, 195, 0.28); }
  .r-cell.active { background: var(--rail-copper); }

  .spine-steps {
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .spine-step {
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--ink-spine-sub);
    cursor: pointer;
    font-family: inherit;
    transition: background 150ms ease, color 150ms ease;
  }
  .spine-step:hover:not(:disabled):not(.active):not(.seal-active) {
    background: var(--bg-spine-hover);
    color: var(--ink-spine);
  }
  .spine-step:focus-visible { outline: 2px solid var(--rail-mint); outline-offset: -2px; }
  .spine-step.active {
    background: var(--bg-spine-active);
    color: var(--ink-spine);
  }
  .spine-step.seal-active {
    background: var(--bg-spine-seal);
    color: var(--ink-spine);
  }
  .spine-step:disabled { opacity: 0.44; cursor: default; }

  .step-label {
    font-size: 13px;
    font-weight: 620;
    line-height: 1.28;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: normal;
  }
  .spine-step.active .step-label, .spine-step.seal-active .step-label { font-weight: 700; }

  .step-pick {
    font-size: 11.5px;
    color: var(--ink-spine-dim);
    margin-top: 2px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .step-pick-txt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .step-pick.diverged { color: var(--rail-copper); }
  .step-pick.mint { color: var(--rail-mint); }

  .spine-ledger {
    border-top: 1px solid var(--border-spine);
    padding-top: 11px;
    font-size: 11.5px;
    color: var(--ink-spine-sub);
    line-height: 1.44;
    min-width: 0;
  }
  .spine-ledger-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 650;
    color: var(--rail-mint);
    margin-bottom: 2px;
  }

  /* Right Atmospheric Stage Sheet */
  .dossier-stage {
    background: var(--bg-stage);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    min-height: 0;
    min-width: 0;
    position: relative;
  }
  .dossier-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: radial-gradient(circle, var(--dot-grid) 1px, transparent 1.1px);
    background-size: 20px 20px;
    -webkit-mask-image: radial-gradient(ellipse at 56% 40%, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.35) 52%, rgba(0, 0, 0, 0) 80%);
    mask-image: radial-gradient(ellipse at 56% 40%, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.35) 52%, rgba(0, 0, 0, 0) 80%);
  }

  .stage-watermark {
    position: absolute;
    top: 52px;
    right: 16px;
    pointer-events: none;
    opacity: 0.085;
    z-index: 0;
  }

  .stage-header-wrap {
    background: var(--bg-header);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 11px 26px 0;
    position: relative;
    z-index: 2;
  }
  .stage-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 9px;
    flex-wrap: wrap;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .stage-status {
    font-size: 12px;
    color: var(--ink-muted);
    font-weight: 600;
  }

  /* High-Clarity Translucent Mode Switcher */
  .mode-seg {
    display: inline-flex;
    background: var(--bg-seg-track);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 2.5px;
    gap: 2px;
  }
  .mode-pill {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    min-height: 28px;
    padding: 4px 13px;
    font-family: inherit;
    font-size: 12.2px;
    font-weight: 650;
    color: var(--ink-tab-idle);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 130ms ease, border-color 130ms ease, color 130ms ease, box-shadow 130ms ease;
  }
  .mode-pill:hover { color: var(--ink-primary); }
  .mode-pill.active {
    background: var(--bg-seg-active);
    border-color: var(--border-seg-active);
    color: var(--ink-primary);
    font-weight: 730;

  }
  .mode-pill:focus:not(:focus-visible) { outline: none; }
  .mode-pill:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .theme-btn {
    height: 28px;
    padding: 0 10px;
    border-radius: 7px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-btn);
    color: var(--ink-body);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 620;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 130ms ease, border-color 130ms ease, color 130ms ease;
  }
  .theme-btn:hover { background: var(--bg-btn-hover); border-color: var(--copper-border); color: var(--ink-primary); }
  .theme-btn:focus:not(:focus-visible) { outline: none; }
  .theme-btn:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }

  .icon-close {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-muted);

    place-items: center;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-close:hover { background: var(--coral-soft); color: var(--coral); }
  .icon-close:focus:not(:focus-visible) { outline: none; }
  .icon-close:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }

  .horizon-track {
    height: 2px;
    margin: 0 -26px;
    background: var(--hairline-faint);
    overflow: hidden;
  }
  .horizon-fill {
    height: 100%;
    width: 100%;
    background: var(--horizon-beam);

    transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .stage-scroll {
    padding: 16px 26px 14px;
    overflow-y: auto;

    min-height: 0;

    flex-direction: column;
    gap: 13px;
    flex: 1;
    min-width: 0;
    min-height: 0;
  }
  #specPane { min-width: 0; }

  .cascade-item { animation: stageReveal 200ms cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Soft Antique Sand-Ochre Wash Alert (Zero Harsh Yellow, Zero Outer Box) */
  .stratum-alert {
    width: 100%;
    border: none;
    font-family: inherit;
    text-align: left;
    background: var(--bg-amber-wash);
    border-radius: 8px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    transition: background 130ms ease;
  }
  button.stratum-alert { cursor: pointer; }
  button.stratum-alert:focus:not(:focus-visible) { outline: none; }
  button.stratum-alert:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }
  .stratum-left {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 620;
    color: var(--amber);
  }
  .stratum-detail {
    font-size: 11.5px;
    color: var(--ink-body);
    background: var(--bg-clause-when);
    padding: 2px 8px;
    border-radius: 5px;
  }

  /* Eyebrow-Free Decision Heading + Borderless Post-Heading Metadata */
  .open-header {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ask-heading {
    font-size: clamp(19px, 2.0vw, 23.5px);
    font-weight: 700;
    letter-spacing: -0.024em;
    line-height: 1.24;
    color: var(--ink-primary);
    text-wrap: balance;
    max-width: 68ch;
  }
  .context-why {
    font-size: 13.5px;
    color: var(--ink-body);
    line-height: 1.48;
    max-width: 72ch;
  }
  .context-meta-bar {
    display: flex;
    align-items: center;
    gap: 8px 12px;
    flex-wrap: wrap;
    padding-top: 2px;
  }
  .meta-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 620;
    color: var(--copper);
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .ask-heading:focus { outline: none; }
  .impact-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 28px;
    padding: 3.5px 10px;
    border-radius: 6px;
    background: var(--mint-soft);
    border: none;
    font-size: 11.5px;
    font-weight: 620;
    color: var(--mint);
    cursor: pointer;
    max-width: 100%;
    text-align: left;
    overflow-wrap: anywhere;
    transition: background 130ms ease;
  }
  .impact-chip:hover { filter: brightness(1.1); }
  .impact-chip:focus:not(:focus-visible) { outline: none; }
  .impact-chip:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }

  /* Translucent Obsidian-Glass Option Monoliths (Collision-Proof at 2, 3, or 4+ Options) */
  .opt-group {
    display: grid;
    grid-template-columns: repeat(var(--opt-cols, 2), minmax(0, 1fr));
    gap: 14px;
    padding: 2px 0 4px;
  }

  .opt-plinth {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 192px;
    min-width: 0;
    border-radius: 11px;
    background: var(--bg-card-idle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-card);
    cursor: pointer;
    overflow: hidden;
    transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), border-color 150ms ease, background 150ms ease, box-shadow 160ms ease;
  }
  .opt-plinth:not(.selected):hover {
    background: var(--bg-card-hover);
    border-color: var(--copper-border);
    transform: translateY(-2px);
  }
  .opt-plinth.selected {
    background: var(--bg-card-sel);
    border-color: var(--mint-border);
    box-shadow: var(--card-shadow-sel);
    transform: translateY(-2px);
  }
  .opt-plinth:active { transform: translateY(0.5px); }
  .opt-plinth:has(.opt-radio:focus-visible) {
    outline: 2px solid var(--mint-bright);
    outline-offset: 2px;
  }

  .opt-crown {
    height: 1.8px;
    width: 100%;
    background: var(--specular-top);
    pointer-events: none;
    transition: background 150ms ease;
  }
  .opt-plinth:not(.selected):hover .opt-crown { background: var(--copper); }
  .opt-plinth.selected .opt-crown { background: var(--horizon-beam); }

  .opt-sheen {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 130px;
    background: var(--sheen-grad);
    opacity: 0;
    pointer-events: none;
  }
  .opt-plinth.just-locked .opt-sheen { animation: sheenSweep 540ms cubic-bezier(0.16, 1, 0.3, 1); }

  .plinth-spotlight {
    position: absolute;
    inset: 0;
    background: radial-gradient(220px circle at var(--spot-x, 50%) var(--spot-y, 24%), var(--spotlight-col), transparent 72%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 170ms ease;
  }
  .opt-plinth:hover .plinth-spotlight { opacity: 1; }

  .opt-radio {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  .plinth-top {
    position: relative;
    z-index: 1;
    padding: 13px 15px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .opt-crest-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .opt-crest {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .opt-keycap {
    width: 25px;
    height: 25px;
    border-radius: 6px;
    background: var(--bg-btn);
    border: 1px solid var(--border-subtle);
    color: var(--ink-muted);
    font-size: 12px;
    font-weight: 680;
    display: grid;
    place-items: center;
    transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
  }
  .opt-plinth.selected .opt-keycap {
    background: var(--mint-soft);
    border-color: var(--mint-border);
    color: var(--mint-bright);
  }

  .badge-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 640;
    white-space: nowrap;
  }
  .badge.mint { background: var(--mint-soft); color: var(--mint); }
  .badge.copper { background: var(--copper-soft); color: var(--copper); }
  .badge.amber { background: var(--amber-soft); color: var(--amber); }

  .opt-does {
    font-size: 14.2px;
    font-weight: 540;
    color: var(--ink-body);
    line-height: 1.43;
  }
  .opt-plinth.selected .opt-does {
    font-weight: 620;
    color: var(--ink-primary);
  }
  .opt-slug-tag {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--copper);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .opt-plinth.selected .opt-slug-tag { color: var(--mint); }

  /* Collision-Proof Translucent Pedestal */
  .opt-entry { display: flex; flex-direction: column; min-width: 0; }
  .opt-entry > .opt-plinth { flex: 1; }
  @supports (grid-template-rows: subgrid) {
    .opt-entry { display: grid; grid-row: span 2; grid-template-rows: subgrid; row-gap: 0; }
  }
  .opt-plinth.dominated { opacity: 0.78; }
  .opt-plinth.dominated.selected { opacity: 1; }
  .option-delta { display: flex; gap: 5px 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 12px; line-height: 1.35; }
  .delta-ref-tag { color: var(--ink-muted); font-size: 11px; font-weight: 680; }
  .delta-pro { color: var(--mint); font-weight: 660; }
  .delta-con { color: var(--amber); font-weight: 640; }
  .delta-sep { color: var(--ink-muted); opacity: 0.65; }
  .score-readout { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .score-readout.benefit { --score-fill: var(--copper); }
  .score-gauge { display: inline-flex; gap: 3px; }
  .score-segment { width: 10px; height: 6px; border: 1px solid var(--ink-muted); border-radius: 2px; }
  .score-segment.filled { background: var(--score-fill, var(--ink-body)); border-color: var(--score-fill, var(--ink-body)); }
  .seal-commit-row { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .seal-commit-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .seal-intent { font-size: 13px; color: var(--ink-body); line-height: 1.4; }
  .seal-exec-details { margin-top: 4px; font-size: 12px; color: var(--ink-body); }
  .seal-exec-details summary { cursor: pointer; color: var(--ink-muted); font-weight: 620; list-style: none; display: inline-flex; align-items: center; gap: 5px; }
  .seal-exec-details summary::-webkit-details-marker { display: none; }
  .seal-exec-details summary:hover { color: var(--ink-primary); }
  .seal-exec-why { margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--border-subtle); color: var(--ink-body); line-height: 1.45; }
  .opt-entry:has(.option-details) { --detail-border: var(--border-card); }
  .opt-entry:has(.option-details) > .opt-plinth { border-radius: 11px 11px 0 0; transform: none; }
  .opt-entry:has(.opt-plinth.selected) { --detail-border: var(--mint-border); }
  .opt-entry:has(.opt-plinth:not(.selected):hover) { --detail-border: var(--copper-border); }
  .option-details {
    min-width: 0;
    border: 1px solid var(--detail-border);
    border-top: 0;
    border-radius: 0 0 11px 11px;
    background: var(--bg-pedestal);
    overflow-wrap: anywhere;
  }
  .option-details summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 14px;
    min-height: 34px;
    cursor: pointer;
    list-style: none;
    color: var(--ink-body);
    font-size: 12px;
    font-weight: 620;
  }
  .option-details summary::-webkit-details-marker { display: none; }
  .option-details summary::after {
    content: "";
    flex: 0 0 6px;
    height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(45deg);
  }
  .option-details[open] summary::after { transform: rotate(225deg); }
  .option-details summary:hover { background: var(--bg-btn); color: var(--ink-primary); }
  .option-details summary:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: -2px; }
  .option-details-list { margin: 0; padding: 0 14px 9px; font-size: 12.5px; }
  .option-detail-row {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    gap: 8px;
    padding: 5px 0;
    border-top: 1px solid var(--hairline-faint);
  }
  .option-detail-row dt { color: var(--ink-muted); }
  .option-detail-row dd { margin: 0; color: var(--ink-primary); font-weight: 620; }
  .option-detail-row dd.diverges { color: var(--amber); }

  .plinth-pedestal {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: minmax(0, 0.98fr) minmax(0, 0.64fr) minmax(0, 1.28fr);
    background: var(--bg-pedestal);
    border-top: 1px solid var(--border-subtle);
    padding: 9px 10px 10px;
    gap: 5px;
  }
  .stat-pillar {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    overflow: hidden;
  }
  .stat-pillar + .stat-pillar {
    border-left: 1px solid var(--hairline-faint);
    padding-left: 6px;
  }
  .stat-micro {
    font-size: 10.5px;
    font-weight: 680;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
  }
  .ledger-cell {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    white-space: nowrap;
  }
  .ledger-val {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-primary);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ledger-delta {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
  }
  .effort-bar {
    height: 2.5px;
    border-radius: 2px;
    background: var(--pip-off);
    overflow: hidden;
    margin-top: 2px;
  }
  .effort-fill {
    height: 100%;
    background: var(--copper);
    opacity: 0.82;
  }
  .opt-plinth.selected .effort-fill { background: var(--mint); }

  /* Observatory Causal Storyboard Apparatus View */
  .spec-lens-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .lens-pill {
    background: var(--bg-btn);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    min-height: 30px;
    padding: 5px 12px;
    color: var(--ink-body);
    font-family: inherit;
    font-size: 12px;
    font-weight: 640;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: border-color 130ms ease, background 130ms ease, color 130ms ease;
  }
  .lens-pill:hover { background: var(--bg-btn-hover); color: var(--ink-primary); }
  .lens-pill.active {
    background: var(--mint-soft);
    border-color: var(--mint-border);
    color: var(--ink-primary);
  }
  .lens-pill:focus:not(:focus-visible) { outline: none; }
  .lens-pill:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; }
  .spec-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 12px;
    border-radius: 8px;
    background: var(--bg-spec-band);
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--ink-body);
  }
  .spec-tabs-wrap { position: relative; margin-bottom: 16px; }
  .spec-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-bottom: 1px solid var(--border-subtle);
  }
  .tab-btn {
    background: transparent;
    border: none;
    padding: 7px 4px 10px;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    font-weight: 650;
    color: var(--ink-tab-idle);
    cursor: pointer;
    transition: color 130ms ease;
  }
  .tab-btn:hover { color: var(--ink-primary); }
  .tab-btn.active { color: var(--ink-primary); font-weight: 740; }
  .tab-btn:focus:not(:focus-visible) { outline: none; }
  .tab-btn:focus-visible { outline: 2px solid var(--mint-bright); outline-offset: 2px; border-radius: 4px; }
  .tab-glide {
    position: absolute;
    bottom: -1px; left: 0;
    width: calc(33.333% - 18px);
    height: 2.2px;
    border-radius: 2px;
    background: var(--horizon-beam);
    transition: transform 185ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Editorial Contract Masthead */
  .dossier-masthead {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
    padding: 2px 2px 4px;
  }
  .masthead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .masthead-id-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .masthead-title {
    font-size: 16.5px;
    font-weight: 740;
    letter-spacing: -0.018em;
    color: var(--ink-primary);
  }
  .masthead-slug {
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 5px;
    background: var(--copper-soft);
    color: var(--copper);
  }
  .masthead-intent {
    font-size: 13.8px;
    line-height: 1.5;
    color: var(--ink-body);
    max-width: 74ch;
  }

  /* Causal Story Chapters: WHEN (Cause) ──◇──▶ THEN (Effect) */
  .story-card {
    position: relative;
    background: var(--bg-spec-band);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border-subtle);
    border-radius: 11px;
    padding: 11px 14px 13px;
    margin-bottom: 10px;
  }
  .story-card.relaxed {
    border-color: var(--amber-border);
  }
  .story-hdr {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 11px;
  }
  .story-title-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .story-chap-num {
    font-size: 11px;
    font-weight: 750;
    color: var(--copper);
    padding: 1.5px 6px;
    border-radius: 4px;
    background: var(--copper-soft);
  }
  .story-title {
    font-size: 14.5px;
    font-weight: 720;
    letter-spacing: -0.014em;
    color: var(--ink-primary);
  }
  .story-slug {
    font-size: 11.5px;
    color: var(--ink-muted);
  }
  .story-meta {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .stage-pill {
    font-size: 11px;
    font-weight: 650;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--bg-clause-when);
    color: var(--ink-tab-idle);
  }

  .causal-stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 66px minmax(0, 1.08fr);
    align-items: stretch;
    gap: 0;
  }
  .causal-chamber {
    border-radius: 10px;
    padding: 10px 13px 11px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .chamber-when {
    background: var(--bg-when-chamber);
    border: 1px solid var(--border-when-chamber);
  }
  .chamber-then {
    background: var(--bg-then-chamber);
    border: 1px solid var(--border-then-chamber);
  }
  .chamber-then.relaxed {
    background: var(--bg-then-relax);
    border-color: var(--border-then-relax);
  }
  .act-kicker {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--hairline-faint);
  }
  .act-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 760;
    letter-spacing: 0.04em;
  }
  .act-role {
    font-size: 11.5px;
    font-weight: 560;
    color: var(--ink-muted);
  }

  .causal-conduit {
    width: 66px;
    margin: 0 -1px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .pred-stack {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    justify-content: center;
  }
  .trigger-row {
    display: flex;
    flex-direction: column;
    gap: 5px;

<body>
<div id="srAnnouncer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  let stepIdx = 0;
  let specOpen = false;
  let tabIdx = 0;
  let selectedSpecCid = panels.length ? (panels[0].id || "") : "";
  let armed = false;
  let submitting = false;
  let justLockedKey = "";
  let spinePickNodes = [];
  let spineWaveCleanup = null;
  const armMs = Math.max(80, Number(REQ.quiet_arm_ms) || 260);

  const SVG_NS = "http://www.w3.org/2000/svg";

    const raw = String(slug || "").trim();
    if (!raw) return "Decision";
    const parts = raw.split(/[-_\s]+/).filter(Boolean);
    return parts.map((w, i) => ACRONYMS.has(w.toLowerCase()) ? w.toUpperCase() : (i === 0 ? w.charAt(0).toUpperCase() + w.slice(1) : w)).join(" ");
  }

  function parseHours(eff) {
    const m = String(eff || "").match(/(\d+(?:\.\d+)?)\s*h/i);
    return m ? Number(m[1]) : null;
  }

  function pingActivity() {
    const now = Date.now();
    if (now - lastActPing > 2000 && !submitting) {
      lastActPing = now;
      fetch("/api/activity", { method: "POST", headers: { "X-Drift-Token": CSRF } }).catch(() => {});
    }
  }
  function totalSteps() { return cards.length + 1; }
  function rearm() {
    armed = false;
    if (armTimer) clearTimeout(armTimer);
    syncFooter();
    armTimer = setTimeout(() => { armed = true; syncFooter(); }, armMs);
  }
  function settledCardsCount() {
    let n = 0;
    for (let i = 0; i < cards.length; i++) {
      if (cards[i].card_kind === "question") { if (answers[i].trim()) n++; }
      else { if (picks[i].trim()) n++; }
    }
    return n;
  }
  function allCardsReady() {
    return settledCardsCount() === cards.length;
  }
  function hasAmendments() {
    if (changeOpen && noteVal.trim().length > 0) return true;
    for (let i = 0; i < cards.length; i++) {
      if (cards[i].card_kind === "question") return true;
      if (picks[i] !== (cards[i].proposed_pick || "")) return true;
    }
    return false;
  }
  function currentReady() {
    if (stepIdx >= cards.length) {
      if (!allCardsReady()) return false;
      const amend = hasAmendments() || !REQ.can_seal_directly || !REQ.review_ref;
      if (!amend) {
        const cleanOwn = ownerVal.trim();
        if (!cleanOwn) return false;
        if (Array.isArray(REQ.policy_approvers) && REQ.policy_approvers.length > 0 && !REQ.policy_approvers.includes(cleanOwn)) return false;
      }
      return true;
    }
    const c = cards[stepIdx];
    return c.card_kind === "question" ? answers[stepIdx].trim().length > 0 : picks[stepIdx].trim().length > 0;
  }

  /* Static Header & Chrome Init */
  document.getElementById("brandEmblem").appendChild(makeDriftEmblem(38));
  const proj = REQ.project_name || REQ.area_name || "workspace";
  const pEl = document.getElementById("projTitle");
  pEl.textContent = proj;
  if (REQ.workspace_path) pEl.title = REQ.workspace_path;
  const edTxt = REQ.edition ? ("DRIFT " + String(REQ.edition).toUpperCase() + " · Dossier") : "DRIFT · Review Dossier";
  document.getElementById("projSub").textContent = edTxt;

  function effectiveTheme() {
    const attr = (document.documentElement.getAttribute("data-theme") || curTheme || "auto").toLowerCase();
    if (attr === "light") return "light";
    if (attr === "dark") return "dark";
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }

  function syncThemeControl() {
    const attr = (document.documentElement.getAttribute("data-theme") || "auto").toLowerCase();
    if (attr === "light" || attr === "dark" || attr === "auto") curTheme = attr;
    const eff = effectiveTheme();
    const nextTheme = eff === "dark" ? "Light" : "Dark";
    const quickBtn = document.getElementById("quickThemeBtn");
    quickBtn.title = "Switch to " + nextTheme + " theme";
    quickBtn.setAttribute("aria-label", "Theme: " + (eff === "dark" ? "Dark" : "Light") + ". Activate to switch to " + nextTheme + " theme");
    const iconHost = document.getElementById("themeIconHost");
    iconHost.textContent = "";
    iconHost.appendChild(makeUiIcon("theme", 13));
    document.getElementById("themeLabel").textContent = eff === "dark" ? "Dark" : "Light";

    const cyc = document.getElementById("cycleThemeBtn");
    cyc.textContent = "";
    cyc.appendChild(makeUiIcon("theme", 14));
    cyc.appendChild(el("span", "", curTheme === "auto"
      ? ("Theme: Auto (" + eff + ") — lock to " + nextTheme)
      : ("Reset theme to Auto (currently " + curTheme + ")")));
  }
  function toggleDirectTheme() {
    curTheme = effectiveTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", curTheme);
    syncThemeControl();
    announce("Theme switched to " + curTheme);
  }
  function toggleAutoTheme() {
    curTheme = curTheme === "auto" ? (effectiveTheme() === "dark" ? "light" : "dark") : "auto";
    document.documentElement.setAttribute("data-theme", curTheme);
    syncThemeControl();
    announce("Theme mode set to " + curTheme);
  }
  syncThemeControl();
  if (typeof MutationObserver !== "undefined") {
    new MutationObserver(() => { syncThemeControl(); })
      .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }
  if (window.matchMedia) {
    try { window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", syncThemeControl); } catch (_) {}
  }

  const termOnceBtn = document.getElementById("termOnceBtn");
  termOnceBtn.appendChild(makeUiIcon("terminal", 13));
  termOnceBtn.appendChild(el("span", "", "CLI"));

  const alwaysTermBtn = document.getElementById("alwaysTermBtn");

  const strataHost = document.getElementById("strataHost");
  if (REQ.git_branch) {

    bp.appendChild(bs);

  }
  if (REQ.is_linked_worktree || (REQ.worktree_name && REQ.worktree_name.toLowerCase() !== proj.toLowerCase())) {
    const wp = el("div", "strata-pill mono");
    const ws = svgEl("svg", { width: "12", height: "12", viewBox: "0 0 12 12", fill: "none", stroke: "#58DCC3", "stroke-width": "1.2" });
    ws.appendChild(svgEl("polygon", { points: "4,2.2 7.8,6 4,9.8 0.4,6" }));
    ws.appendChild(svgEl("polygon", { points: "8,2.2 11.6,6 8,9.8 4.4,6", fill: "#13171F", stroke: "#76F7DC" }));
    wp.appendChild(ws);
    wp.appendChild(el("span", "", "wt:" + REQ.worktree_name));
    if (REQ.workspace_path) wp.title = REQ.workspace_path;
    strataHost.appendChild(wp);
  }
  if (!strataHost.children.length && REQ.workspace_path) {
    strataHost.appendChild(el("div", "strata-pill mono", REQ.workspace_path));
  }

  const ledgerHost = document.getElementById("spineLedgerHost");
  const execList = Array.isArray(REQ.exec_choices) ? REQ.exec_choices : [];
  if (execList.length > 0) {
    const lt = el("div", "spine-ledger-title");
    lt.appendChild(makeUiIcon("diamond-fill", 11));
    lt.appendChild(el("span", "", execList.length + (execList.length === 1 ? " auto-resolved choice" : " auto-resolved choices")));
    ledgerHost.appendChild(lt);
    const firstEc = execList[0];
    const row = el("div", "mono", (firstEc.card_id || "choice") + " = " + (firstEc.pick || ""));
    row.style.fontSize = "11.5px";
    ledgerHost.appendChild(row);
  } else {
    const tCount = REQ.targets_count || panels.length || 0;
    const uCount = REQ.unchanged_count || REQ.hidden_count || 0;
    const lt = el("div", "spine-ledger-title");
    lt.appendChild(makeUiIcon("diamond-fill", 11));
    lt.appendChild(el("span", "", "Wave scope"));
    ledgerHost.appendChild(lt);
    ledgerHost.appendChild(el("div", "mono", tCount + (tCount === 1 ? " target contract" : " target contracts") + (uCount > 0 ? " · " + uCount + " quiet" : "")));
  }

  function reviewedCardsCount() {
    let n = 0;
    for (let i = 0; i < cards.length; i++) {
      const hasVal = cards[i].card_kind === "question" ? answers[i].trim().length > 0 : picks[i].trim().length > 0;
      if (hasVal && reviewedSteps.has(i)) n++;
    }
    return n;
  }

  function renderReadiness() {
    const host = document.getElementById("readinessHost");
    host.textContent = "";
    const reviewed = reviewedCardsCount();
    const total = cards.length;
    host.setAttribute("aria-valuemax", String(Math.max(1, total)));
    host.setAttribute("aria-valuenow", String(total === 0 ? 1 : reviewed));
    host.setAttribute("aria-valuetext", total === 0 ? "Seal ready" : (reviewed + " of " + total + " slices reviewed"));
    const top = el("div", "readiness-top mono");
    top.appendChild(el("span", "", "WAVE READINESS"));
    const statusText = total === 0
      ? "SEAL READY"
      : (reviewed === total ? (total + " / " + total + " CONFIRMED") : (reviewed + " / " + total + " REVIEWED"));
    const cnt = el("span", "readiness-count", statusText);
    top.appendChild(cnt);
    host.appendChild(top);

    const cells = el("div", "readiness-cells");
    const slots = Math.max(1, total + 1);
    for (let i = 0; i < slots; i++) {
      let cls = "r-cell";
      if (i < total) {
        const hasVal = cards[i].card_kind === "question" ? answers[i].trim().length > 0 : picks[i].trim().length > 0;
        if (!specOpen && stepIdx === i) cls += " active";
        else if (hasVal && reviewedSteps.has(i)) cls += " done";
        else if (hasVal) cls += " default-ready";
      } else {
        if (!specOpen && stepIdx >= total) cls += allCardsReady() ? " done" : " active";
        else if (total === 0 || reviewed === total) cls += " done";
      }
      cells.appendChild(el("div", cls));
    }
    host.appendChild(cells);
  }

  function formatPickLine(node, c, idx) {
    node.textContent = "";
    const active = !specOpen && stepIdx === idx;
    const chosen = c.card_kind === "question" ? (answers[idx].trim() || "Open question") : (picks[idx] || "Select option");
    const diverged = c.card_kind !== "question" && c.proposed_pick && picks[idx] && picks[idx] !== c.proposed_pick;
    node.className = "step-pick mono" + (diverged || active ? " diverged" : "");
    if (diverged) node.appendChild(makeUiIcon("refresh", 11));
    node.appendChild(el("span", "step-pick-txt", chosen));
  }

  function syncSpinePicksInPlace() {
    renderSpine();
  }

  /* Living DRIFT Harmonic Wave & 45° Concentric Diamond Spine */
  function renderSpine() {
    renderReadiness();
    const host = document.getElementById("spineStepsHost");
    host.textContent = "";
    spinePickNodes = [];
    if (spineWaveCleanup) { spineWaveCleanup(); spineWaveCleanup = null; }

    const totalRows = cards.length + 1;
    const stretch = totalRows >= 2 && totalRows <= 6;
    const trackGrid = el("div", "");
    trackGrid.style.display = "grid";
    trackGrid.style.gridTemplateColumns = "38px minmax(0, 1fr)";
    if (stretch) {
      trackGrid.style.flex = "1";
      trackGrid.style.gridTemplateRows = `repeat(${totalRows}, minmax(54px, 1fr))`;
      trackGrid.style.alignItems = "center";
    }
    trackGrid.style.position = "relative";

    const svgCol = el("div", "");
    svgCol.style.gridColumn = "1";
    svgCol.style.gridRow = "1 / span " + totalRows;
    svgCol.style.position = "relative";
    trackGrid.appendChild(svgCol);

    const rowBtns = [];
    const kinds = [];

    cards.forEach((c, idx) => {
      const active = !specOpen && stepIdx === idx;
      const hasVal = c.card_kind === "question" ? answers[idx].trim().length > 0 : picks[idx].trim().length > 0;
      const confirmed = hasVal && reviewedSteps.has(idx);
      const kind = active ? "active" : (confirmed ? "done" : "idle");
      kinds.push(kind);

      const btn = el("button", "spine-step" + (active ? " active" : (confirmed ? " done" : "")));
      btn.type = "button";
      btn.disabled = false;
      if (active) btn.setAttribute("aria-current", "step");
      btn.style.gridColumn = "2";
      btn.style.marginBottom = stretch ? "0" : "8px";

      const txt = el("div", "");
      txt.appendChild(el("div", "step-label", humanizeSlug(c.card_id || c.contract_id)));
      const pickNode = el("div", "step-pick mono");
      formatPickLine(pickNode, c, idx);
      spinePickNodes.push(pickNode);
      txt.appendChild(pickNode);
      btn.appendChild(txt);

      btn.addEventListener("click", () => {
        specOpen = false;
        stepIdx = idx;
        rearm();
        renderAll(true);
        announce("Step " + (idx + 1) + " of " + totalSteps() + ": " + (c.ask || humanizeSlug(c.card_id)));
      });
      trackGrid.appendChild(btn);
      rowBtns.push(btn);
    });

    const sealActive = !specOpen && stepIdx === cards.length;
    const amend = hasAmendments() || !REQ.can_seal_directly || !REQ.review_ref;
    kinds.push(sealActive ? (amend ? "active" : "seal-active") : "seal");

    const sealBtn = el("button", "spine-step" + (sealActive ? (amend ? " active" : " seal-active") : ""));
    sealBtn.type = "button";
    sealBtn.disabled = !allCardsReady();
    if (sealActive) sealBtn.setAttribute("aria-current", "step");
    sealBtn.style.gridColumn = "2";

    const stxt = el("div", "");
    const tCount = REQ.targets_count || 1;
    stxt.appendChild(el("div", "step-label", amend ? "Review changes" : ("Seal " + tCount + (tCount === 1 ? " contract" : " contracts"))));
    const shortRef = REQ.review_ref ? REQ.review_ref.slice(0, 19) : "re-review";
    stxt.appendChild(el("div", "step-pick mono" + (sealActive && !amend ? " mint" : ""), shortRef));
    sealBtn.appendChild(stxt);

    sealBtn.addEventListener("click", () => {
      if (!allCardsReady()) return;
      for (let k = 0; k < cards.length; k++) reviewedSteps.add(k);
      specOpen = false;
      stepIdx = cards.length;
      rearm();
      renderAll(true);
    });
    trackGrid.appendChild(sealBtn);
    rowBtns.push(sealBtn);
    trackGrid.addEventListener("keydown", ev => {
      if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
      const enabledBtns = rowBtns.filter(b => !b.disabled);
      const curIdx = enabledBtns.indexOf(document.activeElement);
      if (curIdx < 0) return;
      ev.preventDefault();
      const nextIdx = ev.key === "ArrowDown"
        ? (curIdx + 1) % enabledBtns.length
        : (curIdx - 1 + enabledBtns.length) % enabledBtns.length;
      enabledBtns[nextIdx].focus();
    });
    host.appendChild(trackGrid);

    function drawWave() {
      const n = rowBtns.length;
      if (!n) return;
      const gRect = trackGrid.getBoundingClientRect();
      const fallbackSlot = Math.max(58, (gRect.height || 240) / n);
      const ys = rowBtns.map((b, i) => {
        const r = b.getBoundingClientRect();
        return r.height > 1 ? (r.top - gRect.top + r.height * 0.5) : (fallbackSlot * (i + 0.5));
      });
      const h = Math.max(gRect.height || 220, ys[n - 1] + 22);
      const cx = 18;
      const s = svgEl("svg", { width: "36", height: h.toFixed(1), viewBox: `0 0 36 ${h.toFixed(1)}`, fill: "none" });
      const defs = svgEl("defs", {});
      const lg = svgEl("linearGradient", { id: "spWaveGrad", x1: "0", y1: "0", x2: "0", y2: "1" });
      lg.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#E8A76D" }));
      lg.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#58DCC3" }));
      defs.appendChild(lg);
      const rg = svgEl("radialGradient", { id: "spOrbGlow" });
      rg.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#FFDFB0", "stop-opacity": "0.88" }));
      rg.appendChild(svgEl("stop", { offset: "50%", "stop-color": "#E8A76D", "stop-opacity": "0.32" }));
      rg.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#E8A76D", "stop-opacity": "0" }));
      defs.appendChild(rg);
      s.appendChild(defs);

      if (n > 1) {
        s.appendChild(svgEl("line", { x1: cx, y1: Math.max(6, ys[0] - 12), x2: cx, y2: ys[n - 1] + 12, stroke: "rgba(154,158,166,0.26)", "stroke-width": "1", "stroke-dasharray": "2 6" }));
      }
      const activeSegIdx = Math.min(Math.max(0, stepIdx), Math.max(0, n - 2));
      for (let i = 0; i < n - 1; i++) {
        const y1 = ys[i] + 11.5;
        const y2 = ys[i + 1] - 11.5;
        if (y2 <= y1 + 4) continue;
        const span = y2 - y1;
        const ym = (y1 + y2) * 0.5;
        const done = kinds[i] === "done";
        const isPrimary = (i === activeSegIdx);
        const intoSeal = (i === n - 2);
        const amp = Math.min(7.2, Math.max(4.8, span * 0.082));

        s.appendChild(svgEl("path", { d: `M${cx - 12} ${ym}h4.6M${cx - 9.7} ${ym - 2.3}v4.6`, stroke: "rgba(122,148,139,0.42)", "stroke-width": "0.85" }));
        const d1 = `M ${cx} ${y1.toFixed(1)} C ${(cx + amp).toFixed(1)} ${(y1 + span * 0.3).toFixed(1)}, ${(cx - amp).toFixed(1)} ${(y1 + span * 0.7).toFixed(1)}, ${cx} ${y2.toFixed(1)}`;
        const d2 = `M ${cx} ${y1.toFixed(1)} C ${(cx - amp * 0.76).toFixed(1)} ${(y1 + span * 0.32).toFixed(1)}, ${(cx + amp * 0.76).toFixed(1)} ${(y1 + span * 0.68).toFixed(1)}, ${cx} ${y2.toFixed(1)}`;
        s.appendChild(svgEl("path", { d: d2, stroke: intoSeal ? "#58DCC3" : "#E8A76D", "stroke-width": "1.1", "stroke-opacity": (done || isPrimary) ? "0.40" : "0.22", "stroke-linecap": "round" }));
        if (isPrimary) {
          s.appendChild(svgEl("path", { d: d1, stroke: intoSeal ? "#58DCC3" : "#E8A76D", "stroke-width": "4.6", "stroke-opacity": "0.14", "stroke-linecap": "round" }));
        }
        s.appendChild(svgEl("path", { d: d1, stroke: "url(#spWaveGrad)", "stroke-width": (done || isPrimary) ? "1.65" : "1.2", "stroke-opacity": (done || isPrimary) ? "0.90" : "0.44", "stroke-linecap": "round" }));
        const pulse = svgEl("path", { d: d1, stroke: intoSeal ? "#76F7DC" : "#FFD69E", "stroke-width": isPrimary ? "2.0" : "1.35", "stroke-dasharray": isPrimary ? "4 11" : "2.2 14", "stroke-opacity": isPrimary ? "0.90" : "0.34", "stroke-linecap": "round" });
        pulse.appendChild(svgEl("animate", { attributeName: "stroke-dashoffset", from: "30", to: "0", dur: isPrimary ? "1.95s" : "3.4s", repeatCount: "indefinite" }));
        s.appendChild(pulse);

        if (isPrimary) {
          const orbGroup = svgEl("g", {});
          orbGroup.appendChild(svgEl("circle", { r: "7", fill: "url(#spOrbGlow)" }));
          orbGroup.appendChild(svgEl("circle", { r: "2.2", fill: "#FFFFFF", stroke: intoSeal ? "#76F7DC" : "#FFCE8B", "stroke-width": "1.05" }));
          orbGroup.appendChild(svgEl("animateMotion", { path: d1, dur: "2.1s", repeatCount: "indefinite", calcMode: "spline", keyTimes: "0;1", keySplines: "0.42 0 0.58 1" }));
          orbGroup.appendChild(svgEl("animate", { attributeName: "opacity", values: "0.18;1;0.18", dur: "2.1s", repeatCount: "indefinite" }));
          s.appendChild(orbGroup);
        }
      }
      ys.forEach((y, i) => {
        s.appendChild(svgEl("circle", { cx: cx, cy: y.toFixed(1), r: "11.5", fill: "#11151D" }));
        if (kinds[i] === "active") {
          const aura = svgEl("polygon", { points: `${cx},${(y - 10.6).toFixed(1)} ${cx + 10.6},${y.toFixed(1)} ${cx},${(y + 10.6).toFixed(1)} ${cx - 10.6},${y.toFixed(1)}`, stroke: "#E8A76D", "stroke-width": "1", fill: "none" });
          aura.appendChild(svgEl("animate", { attributeName: "opacity", values: "0.58;0.12;0.58", dur: "2.1s", repeatCount: "indefinite" }));
          s.appendChild(aura);
        }
        const g = svgEl("g", { transform: `translate(${cx - 11}, ${(y - 11).toFixed(1)})` });
        Array.from(makeStepDiamond(kinds[i]).childNodes).forEach(ch => g.appendChild(ch.cloneNode(true)));
        s.appendChild(g);
      });
      svgCol.textContent = "";
      svgCol.appendChild(s);
    }

    requestAnimationFrame(drawWave);
    window.addEventListener("resize", drawWave);
    spineWaveCleanup = () => window.removeEventListener("resize", drawWave);
  }

  function buildStratumBar(contractId) {
    const rels = [];
    panels.forEach(p => {
      if (!contractId || p.id === contractId) {
        (p.relaxations || []).forEach(r => rels.push({ cid: p.id, title: r.title, detail: r.detail }));
      }
    });
    if (!rels.length) return null;
    const first = rels[0];
    const bar = el("button", "stratum-alert");
    bar.type = "button";
    bar.title = "Inspect baseline relaxations in Apparatus";
    bar.addEventListener("click", () => {
      if (first.cid) selectedSpecCid = first.cid;
      tabIdx = 0;
      setSpec(true);
    });
    const left = el("div", "stratum-left");
    left.appendChild(makeUiIcon("warn", 14));
    left.appendChild(el("span", "", first.title + (rels.length > 1 ? " (+" + (rels.length - 1) + " more)" : "")));
    bar.appendChild(left);
    if (first.detail) bar.appendChild(el("code", "stratum-detail mono", first.detail));
    return bar;
  }

  function makeBadge(cls, iconKind, label) {

    if (iconKind) b.appendChild(makeUiIcon(iconKind, 11));
    b.appendChild(el("span", "", label));

  }

  function syncModeTabs() {
    const decBtn = document.getElementById("modeDecideBtn");
    const spBtn = document.getElementById("modeSpecBtn");
    decBtn.classList.toggle("active", !specOpen);
    decBtn.setAttribute("aria-selected", !specOpen ? "true" : "false");
    decBtn.tabIndex = !specOpen ? 0 : -1;
    spBtn.classList.toggle("active", specOpen);
    spBtn.setAttribute("aria-selected", specOpen ? "true" : "false");
    spBtn.tabIndex = specOpen ? 0 : -1;

  function isDominatedOption(opt) {
    return Boolean(opt && Array.isArray(opt.dominated_by) && opt.dominated_by.length > 0);
  }

  function resolveReferenceOption(card, selectedPick) {
    const opts = Array.isArray(card && card.options) ? card.options : [];
    if (opts.length < 2) return null;
    const propId = String((card && card.proposed_pick) || "").trim();
    const selId = String(selectedPick || "").trim();
    const selOpt = selId ? opts.find(o => o.id === selId) : null;
    if (selOpt && !isDominatedOption(selOpt)) {
      return { option: selOpt, mode: (propId && selOpt.id === propId) ? "vs Default" : "vs Selected" };
    }
    const propOpt = propId ? opts.find(o => o.id === propId) : null;
    if (propOpt && !isDominatedOption(propOpt)) {
      return { option: propOpt, mode: "vs Default" };
    }
    return null;
  }

  function parseOptionVector(opt) {
    const chips = Array.isArray(opt && opt.chips) ? opt.chips.map(String) : [];
    const hm = String((opt && opt.effort) || "").match(/(\d+(?:\.\d+)?)\s*h/i);
    const hours = hm ? Number(hm[1]) : null;
    const rl = Number(opt && opt.risk_level) || 0;
    const risk = (rl >= 1 && rl <= 4) ? rl : null;
    const uLow = String((opt && opt.undo) || "").trim().toLowerCase();
    const undoRank = uLow === "easy" ? 1 : (uLow === "costly" ? 2 : (uLow === "one-way" ? 3 : null));
    let complexity = null, parity = null;
    const deps = [];
    for (const ch of chips) {
      if (/^complexity [1-4]\/4$/.test(ch)) complexity = Number(ch[11]);
      else if (ch === "parity same") parity = "same";
      else if (ch === "parity diverges") parity = "diverges";
      else if (ch.startsWith("dependency ") && ch.length > 11) deps.push(ch.slice(11));
    }
    return { hours, risk, undo: undoRank ? uLow : null, undoRank, complexity, parity, deps };
  }

  function computeReferenceDelta(opt, refOpt, modeLabel) {
    if (!opt || !refOpt || opt.id === refOpt.id || isDominatedOption(refOpt)) return null;
    const a = parseOptionVector(opt), r = parseOptionVector(refOpt);
    const pros = [], cons = [];
    if (a.hours !== null && r.hours !== null && a.hours !== r.hours) {
      const dh = Math.round((a.hours - r.hours) * 100) / 100;
      if (dh < 0) pros.push(dh + "h effort");
      else cons.push("+" + dh + "h effort");
    }
    if (a.complexity !== null && r.complexity !== null && a.complexity !== r.complexity) {
      const txt = "complexity " + a.complexity + "/4 vs " + r.complexity + "/4";
      if (a.complexity < r.complexity) pros.push(txt);
      else cons.push(txt);
    }
    if (a.risk !== null && r.risk !== null && a.risk !== r.risk) {
      const txt = "risk " + a.risk + "/4 vs " + r.risk + "/4";
      if (a.risk < r.risk) pros.push(txt);
      else cons.push(txt);
    }
    if (a.undoRank !== null && r.undoRank !== null && a.undoRank !== r.undoRank) {
      const txt = a.undo + " vs " + r.undo + " undo";
      if (a.undoRank < r.undoRank) pros.push(txt);
      else cons.push(txt);
    }
    if (a.parity !== null && r.parity !== null && a.parity !== r.parity) {
      if (a.parity === "same") pros.push("preserves parity");
      else cons.push("parity diverges");
    }
    if (a.deps.length !== r.deps.length) {
      const dd = a.deps.length - r.deps.length;
      if (dd < 0) pros.push(dd + (dd === -1 ? " dep" : " deps"));
      else cons.push("+" + dd + (dd === 1 ? " dep" : " deps"));
    }
    return { mode: modeLabel || "vs Selected", refId: refOpt.id, pros, cons };
  }

  function formatPanelCommitments(panel) {
    if (!panel || !panel.has_clause_counts) return "";
    const parts = [];
    const actN = Number(panel.active_cases_count) || 0;
    const addN = panel.has_baseline ? (Number(panel.added_cases_count) || 0) : 0;
    if (panel.has_baseline && addN > 0) {
      if (panel.change_kind === "added" || addN === actN) parts.push("+" + addN + (addN === 1 ? " case" : " cases"));
      else parts.push(actN + (actN === 1 ? " case" : " cases") + " (+" + addN + ")");
    } else if (actN > 0) {
      parts.push(actN + (actN === 1 ? " case" : " cases"));
    }
    const invN = Number(panel.invariants_count) || 0;
    if (invN > 0) parts.push(invN + (invN === 1 ? " invariant" : " invariants"));
    const budN = Number(panel.budgets_count) || 0;
    if (budN > 0) parts.push(budN + (budN === 1 ? " budget" : " budgets"));
    const frmN = Number(panel.formal_count) || 0;
    if (frmN > 0) parts.push(frmN + " formal");
    return parts.join(" · ");
  }

  function makeScoreReadout(score, metric) {
    if (!/^[1-4]\/4$/.test(score)) return null;
    const readout = el("span", "score-readout " + metric);
    const gauge = el("span", "score-gauge");
    gauge.setAttribute("aria-hidden", "true");
    const level = Number(score[0]);
    for (let segment = 0; segment < 4; segment++) {
      gauge.appendChild(el("span", "score-segment" + (segment < level ? " filled" : "")));
    }
    readout.append(gauge, el("span", "mono", score));
    return readout;
  }

  function makeOptionDetails(chips, id) {
    const items = [];
    let benefit = "", confidence = "", complexity = "", parity = "";
    const deps = [];
    for (const chip of chips) {
      if (/^leverage [1-4]\/4$/.test(chip)) benefit = chip.slice(9);
      else if (/^confidence [1-4]\/4$/.test(chip)) confidence = chip.slice(11);
      else if (/^complexity [1-4]\/4$/.test(chip)) complexity = chip.slice(11);
      else if (/^parity (same|diverges)$/.test(chip)) parity = chip === "parity same" ? "Same" : "Diverges";
      else if (chip.startsWith("dependency ") && chip.length > 11) deps.push(chip.slice(11));
    }
    if (benefit) items.push({ label: "Declared benefit", value: benefit, meter: "benefit" });
    if (confidence) items.push({ label: "Confidence", value: confidence });
    if (complexity) items.push({ label: "Complexity", value: complexity, meter: "complexity" });
    if (parity) items.push({ label: "Parity", value: parity });
    for (const dep of deps) items.push({ label: "Dependency", value: dep });
    if (!items.length) return null;
    const list = el("dl", "option-details-list");
    for (const item of items) {
      const row = el("div", "option-detail-row");
      row.appendChild(el("dt", "", item.label));
      const readout = el("dd", item.label === "Parity" && item.value === "Diverges" ? "diverges" : "");
      if (item.meter) readout.appendChild(makeScoreReadout(item.value, item.meter));
      else readout.textContent = item.value;
      row.appendChild(readout);
      list.appendChild(row);
    }
    const details = el("details", "option-details");
    const toggle = el("summary", "", "Option details");
    toggle.setAttribute("aria-label", "Option details: " + id);
    details.append(toggle, list);
    return details;
  }

  function renderStage(animate) {
    const stagePane = document.getElementById("stagePane");
    const specPane = document.getElementById("specPane");
    const statusEl = document.getElementById("stageStatus");
    const hFill = document.getElementById("horizonFill");
    const hBar = document.getElementById("horizonBar");
    const tSteps = Math.max(1, totalSteps());
    const ratio = tSteps <= 1 ? 1 : (stepIdx + 1) / tSteps;
    hFill.style.transform = "scaleX(" + ratio.toFixed(4) + ")";
    if (hBar) {
      hBar.setAttribute("aria-valuemax", String(tSteps));
      hBar.setAttribute("aria-valuenow", String(Math.min(tSteps, stepIdx + 1)));
      hBar.setAttribute("aria-valuetext", "Step " + Math.min(tSteps, stepIdx + 1) + " of " + tSteps);
    }
    syncModeTabs();

    if (specOpen) {
      stagePane.style.display = "none";
      specPane.style.display = "block";
      statusEl.textContent = "Contract apparatus & baseline delta";
      renderSpec();
      return;
    }

    specPane.style.display = "none";
    stagePane.style.display = "flex";
    stagePane.textContent = "";
    statusEl.textContent = "Step " + (stepIdx + 1) + " of " + totalSteps();

    let cascadeIdx = 0;
    function addCascaded(node) {
      if (animate) {
        node.classList.add("cascade-item");
        node.style.animationDelay = Math.min(140, cascadeIdx * 32) + "ms";
        cascadeIdx++;
      }
      stagePane.appendChild(node);
    }

    if (stepIdx < cards.length) {
      const card = cards[stepIdx];
      const panel = panelById[card.contract_id] || null;
      const sBar = buildStratumBar(card.contract_id);
      if (sBar) addCascaded(sBar);

      /* Eyebrow-free Bold Heading first, followed by rationale & interactive metadata chips */
      const openHdr = el("div", "open-header");
      const h1 = el("h1", "ask-heading", card.ask || humanizeSlug(card.card_id));
      h1.id = "activeAskHeading";
      h1.tabIndex = -1;
      openHdr.appendChild(h1);

      function makeProseEl(cls, text) {
        const d = el("div", cls);
        const raw = String(text || "");
        const parts = raw.split(/(--[A-Za-z0-9][\w-]*)/g);
        parts.forEach(pt => {
          if (/^--[A-Za-z0-9][\w-]*$/.test(pt)) {
            const sp = el("span", "", pt);
            sp.style.whiteSpace = "nowrap";
            d.appendChild(sp);
          } else if (pt) {
            d.appendChild(document.createTextNode(pt));
          }
        });
        return d;
      }

      let whyLine = String(card.why || "").trim();
      if (!whyLine && Array.isArray(card.cases) && card.cases.length > 0) {
        whyLine = "Governs cases: " + card.cases.join(", ") + ".";
      }
      if (whyLine) openHdr.appendChild(makeProseEl("context-why", whyLine));

      const metaBar = el("div", "context-meta-bar");
      if (card.contract_id) {
        metaBar.appendChild(el("span", "meta-tag mono", card.contract_id));
      }
      const commitSummary = formatPanelCommitments(panel);
      if (commitSummary) {
        const ccBtn = el("button", "impact-chip mono");
        ccBtn.type = "button";
        ccBtn.title = "Inspect committed cases and clauses in Apparatus";
        ccBtn.appendChild(makeUiIcon("diamond-fill", 10));
        ccBtn.appendChild(el("span", "", commitSummary));
        ccBtn.addEventListener("click", () => {
          if (card.contract_id) selectedSpecCid = card.contract_id;
          tabIdx = 0;
          setSpec(true);
        });
        metaBar.appendChild(ccBtn);
      }
      if (card.changed_since_prior) {
        metaBar.appendChild(makeBadge("amber", "refresh", "Updated since prior"));
      }
      const imps = (Array.isArray(card.impacts) && card.impacts.length) ? card.impacts : ((panel && Array.isArray(panel.impacts)) ? panel.impacts : []);
      if (imps.length > 0) {
        const ic = el("button", "impact-chip mono");
        ic.type = "button";
        ic.title = "Inspect contract scope and consumer impacts";
        ic.appendChild(makeBridgeGlyph(true));
        ic.appendChild(el("span", "", imps.join(", ")));
        ic.addEventListener("click", () => {
          if (card.contract_id) selectedSpecCid = card.contract_id;
          tabIdx = 1;
          setSpec(true);
        });
        metaBar.appendChild(ic);
      }
      if (metaBar.children.length > 0) openHdr.appendChild(metaBar);
      addCascaded(openHdr);

      if (card.card_kind === "question" || !Array.isArray(card.options) || card.options.length === 0) {
        const wrap = el("div", "");
        const lbl = el("label", "", "Owner answer");
        lbl.htmlFor = "questionFieldIn";
        lbl.style.display = "block"; lbl.style.fontWeight = "700"; lbl.style.marginBottom = "6px";
        const inp = el("input", "field-in");
        inp.id = "questionFieldIn";
        inp.type = "text"; inp.value = answers[stepIdx] || "";
        inp.placeholder = "Enter factual answer for this contract question…";
        inp.addEventListener("input", () => {
          answers[stepIdx] = inp.value;
          if (inp.value.trim()) reviewedSteps.add(stepIdx);
          syncSpinePicksInPlace();
          syncFooter();
        });
        wrap.appendChild(lbl); wrap.appendChild(inp);
        addCascaded(wrap);
        return;
      }

      const hoursList = card.options.map(o => parseHours(o.effort)).filter(n => n !== null);
      const minHours = hoursList.length > 0 ? Math.min.apply(null, hoursList) : null;
      const maxHours = hoursList.length > 0 ? Math.max.apply(null, hoursList) : null;

      const rg = el("div", "opt-group");
      rg.style.setProperty("--opt-cols", card.options.length === 3 ? "3" : "2");
      rg.setAttribute("role", "radiogroup");
      rg.setAttribute("aria-label", card.ask || "Decision options");

      const refInfo = resolveReferenceOption(card, picks[stepIdx]);

      card.options.forEach((opt, j) => {
        const chips = Array.isArray(opt.chips) ? opt.chips.map(String) : [];
        const domList = Array.isArray(opt.dominated_by) ? opt.dominated_by.map(String).filter(Boolean) : [];
        const isDom = domList.length > 0;
        const sel = picks[stepIdx] === opt.id;
        const lockKey = stepIdx + ":" + opt.id;
        const plinth = el("label", "opt-plinth" + (sel ? " selected" : "") + (isDom ? " dominated" : "") + (justLockedKey === lockKey ? " just-locked" : ""));
        plinth.appendChild(el("div", "opt-crown"));
        plinth.appendChild(el("div", "opt-sheen"));
        plinth.appendChild(el("div", "plinth-spotlight"));

        const rad = el("input", "opt-radio");
        rad.type = "radio"; rad.name = "step_opt_" + stepIdx; rad.value = opt.id; rad.checked = sel;
        rad.addEventListener("change", () => {
          if (rad.checked) {
            picks[stepIdx] = opt.id;
            justLockedKey = stepIdx + ":" + opt.id;
            reviewedSteps.add(stepIdx);
            syncSpinePicksInPlace();
            renderStage(false);
            syncFooter();
          }
        });
        plinth.addEventListener("click", () => {
          if (picks[stepIdx] === opt.id && !reviewedSteps.has(stepIdx)) {
            reviewedSteps.add(stepIdx);
            syncSpinePicksInPlace();
          }
        });
        plinth.appendChild(rad);

        const topZone = el("div", "plinth-top");
        const crestBar = el("div", "opt-crest-bar");
        const crest = el("div", "opt-crest");
        crest.appendChild(el("span", "opt-keycap mono", j + 1));
        crest.appendChild(makeSelectorGem(sel));
        crestBar.appendChild(crest);

        const badges = el("div", "badge-row");
        const isProp = Boolean(card.proposed_pick && opt.id === card.proposed_pick);
        const isRec = Boolean((card.recommended_option && opt.id === card.recommended_option) || opt.is_recommended);
        if (isProp && isRec) badges.appendChild(makeBadge("mint", "optimal", "Optimal"));
        else {
          if (isRec) badges.appendChild(makeBadge("mint", "optimal", "Recommended"));
          if (isProp) badges.appendChild(makeBadge("copper", "diamond-fill", "Default"));
        }
        if (isDom) {
          badges.appendChild(makeBadge("amber", "warn", "Dominated by " + domList.join(", ")));
        }
        if (chips.includes("≠ diverges") || chips.includes("diverges") || chips.includes("parity diverges")) {
          badges.appendChild(makeBadge("amber", "warn", "Diverges"));
        }
        if (badges.children.length > 0) crestBar.appendChild(badges);
        topZone.appendChild(crestBar);

        const textWrap = el("div", "");
        textWrap.style.display = "flex";
        textWrap.style.flexDirection = "column";
        textWrap.style.gap = "5px";
        if (opt.does) textWrap.appendChild(el("div", "opt-slug-tag mono", opt.id));
        textWrap.appendChild(makeProseEl("opt-does", opt.does || opt.id));
        topZone.appendChild(textWrap);

        const relDelta = refInfo ? computeReferenceDelta(opt, refInfo.option, refInfo.mode) : null;
        if (relDelta && (relDelta.pros.length > 0 || relDelta.cons.length > 0)) {
          const dRow = el("div", "option-delta");
          dRow.appendChild(el("span", "delta-ref-tag mono", relDelta.mode));
          relDelta.pros.forEach(p => dRow.appendChild(el("span", "delta-pro mono", p)));
          if (relDelta.pros.length > 0 && relDelta.cons.length > 0) {
            dRow.appendChild(el("span", "delta-sep", "│"));
          }
          relDelta.cons.forEach(c => dRow.appendChild(el("span", "delta-con mono", c)));
          topZone.appendChild(dRow);
        }
        plinth.appendChild(topZone);

        const pedestal = el("div", "plinth-pedestal");
        const pEff = el("div", "stat-pillar");
        pEff.appendChild(el("span", "stat-micro mono", "EFFORT"));
        const cEff = el("span", "ledger-cell");
        cEff.appendChild(makeClockIcon());
        const hVal = parseHours(opt.effort);
        cEff.appendChild(el("span", "ledger-val mono", opt.effort || "—"));
        if (hVal !== null && minHours !== null && hVal > minHours) {
          cEff.appendChild(el("span", "ledger-delta mono", "+" + (hVal - minHours) + "h"));
        }
        pEff.appendChild(cEff);
        if (hVal !== null && maxHours !== null && maxHours > 0) {
          const eb = el("div", "effort-bar");
          const ef = el("div", "effort-fill");
          ef.style.width = Math.max(14, Math.round((hVal / maxHours) * 100)) + "%";
          eb.appendChild(ef);
          pEff.appendChild(eb);
        }
        pedestal.appendChild(pEff);

        const pRisk = el("div", "stat-pillar");
        pRisk.appendChild(el("span", "stat-micro mono", "RISK"));
        const cRisk = el("span", "ledger-cell");
        const rl = Number(opt.risk_level) || 0;
        cRisk.appendChild(el("span", "ledger-val mono", rl > 0 ? (rl + "/4") : "—"));
        pRisk.appendChild(cRisk);
        pRisk.appendChild(makeRiskGauge(rl));
        pedestal.appendChild(pRisk);

        const pUndo = el("div", "stat-pillar");
        pUndo.appendChild(el("span", "stat-micro mono", "UNDO"));
        const cUndo = el("span", "ledger-cell");
        const uRaw = String(opt.undo || "").trim();
        const uLow = uRaw.toLowerCase();
        cUndo.appendChild(makeUndoIcon(uLow));
        const uTxt = el("span", "ledger-val", uRaw ? (uRaw.charAt(0).toUpperCase() + uRaw.slice(1)) : "—");
        uTxt.style.color = uLow === "one-way" ? "var(--amber)" : (uLow === "costly" ? "var(--copper)" : "var(--mint)");
        cUndo.appendChild(uTxt);
        pUndo.appendChild(cUndo);
        pedestal.appendChild(pUndo);

        plinth.appendChild(pedestal);

        plinth.addEventListener("mousemove", ev => {
          const r = plinth.getBoundingClientRect();
          if (r.width > 10 && r.height > 10) {
            plinth.style.setProperty("--spot-x", (((ev.clientX - r.left) / r.width) * 100).toFixed(1) + "%");
            plinth.style.setProperty("--spot-y", (((ev.clientY - r.top) / r.height) * 100).toFixed(1) + "%");
          }
        });

        const entry = el("div", "opt-entry");
        entry.appendChild(plinth);
        const details = makeOptionDetails(chips, opt.id);
        if (details) entry.appendChild(details);
        rg.appendChild(entry);
      });
      justLockedKey = "";
      addCascaded(rg);
      return;
    }

    /* Final Step: Seal or Request Changes */
    const sBar = buildStratumBar("");
    if (sBar) addCascaded(sBar);

    const amend = hasAmendments() || !REQ.can_seal_directly || !REQ.review_ref;
    const tCount = REQ.targets_count || 1;

    const hero = el("div", "seal-hero");
    hero.appendChild(makeSealMedallion(amend));
    const hText = el("div", "");
    hText.appendChild(el("h1", "ask-heading", amend ? "Changes requested" : ("Ready to approve " + tCount + (tCount === 1 ? " contract" : " contracts"))));
    hText.lastChild.style.marginBottom = "4px";
    hText.appendChild(el("div", "", amend
      ? "DRIFT will return your updated choices or instructions for delta recomputation. Zero contracts will be approved."
      : "Press Ctrl+Enter (Cmd+Enter) or click Approve below to seal this verified snapshot."));
    hText.lastChild.style.color = "var(--ink-body)";
    hText.lastChild.style.fontSize = "13.5px";
    hero.appendChild(hText);
    addCascaded(hero);

    const ticket = el("div", "seal-ticket");
    ticket.appendChild(el("div", "ticket-crown"));

    function appendPanelCommitRow(host, p) {
      const r = el("div", "ticket-row");
      const wrap = el("div", "seal-commit-row");
      const top = el("div", "seal-commit-top");
      top.appendChild(el("span", "mono", p.id || p.file || "contract"));
      top.lastChild.style.fontWeight = "750";
      top.lastChild.style.color = "var(--copper)";
      const cSum = formatPanelCommitments(p);
      if (cSum) {
        const cBtn = el("button", "impact-chip mono");
        cBtn.type = "button";
        cBtn.title = "Open contract cases in Apparatus";
        cBtn.appendChild(makeUiIcon("diamond-fill", 10));
        cBtn.appendChild(el("span", "", cSum));
        cBtn.addEventListener("click", () => {
          if (p.id) selectedSpecCid = p.id;
          tabIdx = 0;
          setSpec(true);
        });
        top.appendChild(cBtn);
      }
      wrap.appendChild(top);
      if (p.intent) wrap.appendChild(el("div", "seal-intent", p.intent));
      r.appendChild(wrap);
      host.appendChild(r);
    }

    if (panels.length > 0) {
      const visPanels = panels.slice(0, 4);
      visPanels.forEach(p => appendPanelCommitRow(ticket, p));
      if (panels.length > 4) {
        const moreRow = el("div", "ticket-row");
        const det = el("details", "seal-exec-details");
        det.style.width = "100%";
        det.appendChild(el("summary", "mono", "+" + (panels.length - 4) + " more target contracts"));
        const inner = el("div", "");
        inner.style.marginTop = "6px";
        panels.slice(4).forEach(p => appendPanelCommitRow(inner, p));
        det.appendChild(inner);
        moreRow.appendChild(det);
        ticket.appendChild(moreRow);
      }
    }

    if (cards.length > 0) {
      cards.forEach((c, i) => {
        const r = el("div", "ticket-row");
        const left = el("div", "");
        left.appendChild(el("div", "mono", (c.contract_id || "") + " · " + humanizeSlug(c.card_id)));
        left.lastChild.style.fontSize = "12px";
        left.lastChild.style.color = "var(--ink-muted)";
        const val = c.card_kind === "question" ? answers[i] : picks[i];
        const diff = c.card_kind === "question" || (c.proposed_pick && picks[i] !== c.proposed_pick);
        const vLine = el("div", "mono");
        vLine.style.display = "flex"; vLine.style.alignItems = "center"; vLine.style.gap = "6px";
        vLine.style.fontWeight = "800"; vLine.style.fontSize = "14px"; vLine.style.marginTop = "3px";
        vLine.style.color = diff ? "var(--copper)" : "var(--mint)";
        vLine.appendChild(makeUiIcon(diff ? "refresh" : "check", 12));
        vLine.appendChild(el("span", "", val + (diff ? " (updated)" : "")));
        left.appendChild(vLine);
        r.appendChild(left);

        const eb = el("button", "btn", "Edit");
        eb.type = "button";
        eb.style.padding = "5px 12px";
        eb.style.fontSize = "12px";
        eb.addEventListener("click", () => { stepIdx = i; rearm(); renderAll(true); });
        r.appendChild(eb);
        ticket.appendChild(r);
      });
    }

    if (execList.length > 0) {
      execList.forEach(ec => {
        const r = el("div", "ticket-row");
        const wrap = el("div", "seal-commit-row");
        const top = el("div", "seal-commit-top");
        const head = el("span", "mono", (ec.contract_id ? ec.contract_id + " · " : "") + humanizeSlug(ec.card_id || "choice") + " = " + (ec.pick || ""));
        head.style.fontSize = "12.5px";
        head.style.fontWeight = "720";
        head.style.color = "var(--mint)";
        top.appendChild(head);
        const metaParts = [];
        if (ec.effort) metaParts.push(ec.effort);
        if (Number(ec.risk_level) > 0) metaParts.push("risk " + ec.risk_level + "/4");
        if (ec.undo) metaParts.push(ec.undo);
        if (metaParts.length > 0) {
          const mp = el("span", "mono", metaParts.join(" · "));

  function buildWhenChamber(pairs, fallback) {
    const ch = el("div", "causal-chamber chamber-when");
    const kicker = el("div", "act-kicker");
    const tag = el("span", "act-tag mono");
    tag.style.color = "var(--copper)";
    tag.appendChild(makeUiIcon("diamond-outline", 10));
    tag.appendChild(el("span", "", "WHEN"));
    kicker.appendChild(tag);
    kicker.appendChild(el("span", "act-role", "Trigger condition"));
    ch.appendChild(kicker);

    const stack = el("div", "pred-stack");
    if (Array.isArray(pairs) && pairs.length > 0) {
      pairs.forEach(kv => {
        const row = el("div", "trigger-row");
        const keyLine = el("div", "trigger-key mono");
        const kName = el("span", "", kv.key || "");
        kName.style.color = "var(--copper)";
        kName.style.fontWeight = "700";
        keyLine.appendChild(kName);
        keyLine.appendChild(el("span", "", "="));
        row.appendChild(keyLine);

        const rawVal = String(kv.val || "");
        const alts = rawVal.includes(" | ") ? rawVal.split(" | ").map(s => s.trim()).filter(Boolean) : [rawVal];
        const altsWrap = el("div", "trigger-alts");
        alts.forEach((alt, aIdx) => {
          if (aIdx > 0) altsWrap.appendChild(el("span", "alt-or", "or"));
          altsWrap.appendChild(el("span", "alt-token mono", alt));
        });
        row.appendChild(altsWrap);
        stack.appendChild(row);
      });
    } else {
      const fb = el("div", "alt-token mono", fallback || "unconditional");
      stack.appendChild(fb);
    }
    ch.appendChild(stack);
    return ch;
  }

  function buildThenChamber(pairs, fallback, hasRelaxed) {
    const ch = el("div", "causal-chamber chamber-then" + (hasRelaxed ? " relaxed" : ""));
    const kicker = el("div", "act-kicker");
    const tag = el("span", "act-tag mono");
    tag.style.color = hasRelaxed ? "var(--amber)" : "var(--mint)";
    tag.appendChild(makeUiIcon("diamond-fill", 10));
    tag.appendChild(el("span", "", "THEN"));
    kicker.appendChild(tag);
    kicker.appendChild(el("span", "act-role", "Guaranteed effect"));
    ch.appendChild(kicker);

    const stack = el("div", "pred-stack");
    if (Array.isArray(pairs) && pairs.length > 0) {
      pairs.forEach(kv => {
        const isRel = Boolean(kv.relaxed);
        const row = el("div", "outcome-row" + (isRel ? " relaxed" : ""));
        const lhs = el("span", "outcome-lhs mono");
        lhs.appendChild(makeUiIcon(isRel ? "warn" : "check", 11));
        lhs.appendChild(el("span", "", kv.key || ""));
        const rhs = el("strong", "outcome-rhs mono", kv.val || "");

      });
    } else {
      const fb = el("div", "outcome-row mono", fallback || "—");
      stack.appendChild(fb);
    }
    ch.appendChild(stack);
    return ch;
  }

  function syncFooter() {
    const backBtn = document.getElementById("backBtn");
    const priBtn = document.getElementById("primaryBtn");

    setBtnContent(backBtn, "arrow-left", "Back", null, null);
    backBtn.style.display = specOpen ? "none" : "inline-flex";

    if (specOpen) {
      priBtn.className = "btn cta-copper has-lead";
      setCtaGateContent(priBtn, "lead", "back", "Back to decision", null);
      priBtn.disabled = false;
      return;
    }

    const ready = currentReady();
    if (stepIdx < cards.length) {
      const toSeal = (stepIdx + 1 === cards.length);
      priBtn.className = "btn cta-copper has-trail" + (armed ? "" : " unarmed");
      setCtaGateContent(priBtn, "trail", toSeal ? "seal-next" : "next", toSeal ? "Review & Seal" : "Continue", null);
      priBtn.disabled = !ready || submitting;
    } else {
      const amend = hasAmendments() || !REQ.can_seal_directly || !REQ.review_ref;
      const tCount = REQ.targets_count || 1;
      priBtn.className = "btn " + (amend ? "cta-copper" : "cta-mint") + " has-lead" + (armed ? "" : " unarmed");
      if (amend) {
        setCtaGateContent(priBtn, "lead", "amend", "Send for re-review", "Ctrl+Enter");
      } else {
        setCtaGateContent(priBtn, "lead", "approve", "Approve " + tCount + (tCount === 1 ? " contract" : " contracts"), "Ctrl+Enter");
      }
      priBtn.disabled = !ready || submitting;
    }
  }
