name: Publish Registry Packages (crates.io & Maven Central)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target registries to publish (all, crates, maven)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - crates
          - maven

permissions:
  contents: read
  id-token: write

jobs:
  publish-registries:
    name: Publish to crates.io & Maven Central
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Checkout Public Release Repository
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Publish drift_rust to crates.io
        if: ${{ github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'crates' }}
        working-directory: bridges/rust
        env:
          FALLBACK_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys, urllib.error, urllib.request
          from pathlib import Path

          ua = {'User-Agent': 'drift-release-workflow/1.0'}
          reg = os.environ.get('CRATES_REGISTRY_URL', 'https://crates.io').rstrip('/')
          ver = Path('../../VERSION').read_text(encoding='utf-8').splitlines()[0].strip()

          try:
              req = urllib.request.Request(f'{reg}/api/v1/crates/drift_rust/{ver}', headers=ua)
              with urllib.request.urlopen(req, timeout=15) as resp:
                  if 'version' in json.loads(resp.read().decode('utf-8')):
                      print(f'crates.io: drift_rust {ver} already published, skipping')
                      sys.exit(0)
          except (urllib.error.URLError, ValueError):
              pass

          oidc_token = ''
          id_url = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL', '').strip()
          id_tok = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '').strip()
          if id_url and id_tok:
              try:
                  aud = reg.split('://', 1)[-1]
                  sep = '&' if '?' in id_url else '?'
                  jreq = urllib.request.Request(f'{id_url}{sep}audience={aud}', headers={**ua, 'Authorization': f'bearer {id_tok}'})
                  with urllib.request.urlopen(jreq, timeout=15) as jresp:
                      jwt = json.loads(jresp.read().decode('utf-8')).get('value', '')
                  if jwt:
                      treq = urllib.request.Request(
                          f'{reg}/api/v1/trusted_publishing/tokens',
                          data=json.dumps({'jwt': jwt}).encode('utf-8'),
                          headers={**ua, 'Content-Type': 'application/json'},
                          method='POST',
                      )
                      with urllib.request.urlopen(treq, timeout=15) as tresp:
                          oidc_token = json.loads(tresp.read().decode('utf-8')).get('token', '').strip()
              except (urllib.error.URLError, ValueError):
                  oidc_token = ''

          if oidc_token:
              print(f'::add-mask::{oidc_token}', flush=True)
              print('crates.io: authenticated via OIDC Trusted Publishing', flush=True)
              token = oidc_token
          else:
              token = os.environ.get('FALLBACK_CARGO_TOKEN', '').strip()
              if not token:
                  print('crates.io: neither OIDC Trusted Publishing nor CARGO_REGISTRY_TOKEN is configured', file=sys.stderr)
                  sys.exit(1)
              print('crates.io: OIDC Trusted Publishing not active, using CARGO_REGISTRY_TOKEN', flush=True)

          try:
              shutil.copy2('../../README.md', 'README.md')
              shutil.copy2('../../LICENSE', 'LICENSE')
              env = {k: v for k, v in os.environ.items() if k != 'FALLBACK_CARGO_TOKEN'}
              env['CARGO_REGISTRY_TOKEN'] = token
              subprocess.run([os.environ.get('CARGO_BIN', 'cargo'), 'publish', '--allow-dirty'], env=env, check=True)
          finally:
              if oidc_token:
                  try:
                      dreq = urllib.request.Request(
                          f'{reg}/api/v1/trusted_publishing/tokens',
                          headers={**ua, 'Authorization': f'Bearer {oidc_token}'},
                          method='DELETE',
                      )
                      with urllib.request.urlopen(dreq, timeout=15):
                          pass
                  except urllib.error.URLError:
                      pass
          PY

      - name: Setup Java 25 for Maven Central
        if: ${{ github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'maven' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify Release Binaries & Deploy to Maven Central (io.github.rad-ox)
        if: ${{ github.event_name == 'release' || inputs.target == 'all' || inputs.target == 'maven' }}
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          ver=$(sed -n '1p' VERSION | tr -d '\r\n')
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${ver}"
          work=$(mktemp -d)
          gnupg_dir=$(mktemp -d)
          chmod 700 "$gnupg_dir"
          trap 'rm -rf "$work" "$gnupg_dir" ~/.m2/settings.xml' EXIT

          mkdir -p "$work/dl" "$work/bin"
          curl -fsSL "$base/SHA256SUMS" -o "$work/dl/SHA256SUMS"
          curl -fsSL "$base/drift-${ver}-linux-x64.tar.gz" -o "$work/dl/drift-${ver}-linux-x64.tar.gz"
          curl -fsSL "$base/drift-${ver}-windows-x64.zip" -o "$work/dl/drift-${ver}-windows-x64.zip"
          (cd "$work/dl" && grep -E "  drift-${ver}-(linux-x64\.tar\.gz|windows-x64\.zip)$" SHA256SUMS | sha256sum --quiet -c -)
          tar -xzf "$work/dl/drift-${ver}-linux-x64.tar.gz" -C "$work/bin" --strip-components=2 "drift-${ver}-linux-x64/bin/drift"
          unzip -q -j "$work/dl/drift-${ver}-windows-x64.zip" "drift-${ver}-windows-x64/bin/drift.exe" -d "$work/bin"

          export GNUPGHOME="$gnupg_dir"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf 'pinentry-mode loopback\n' >> "$GNUPGHOME/gpg.conf"

          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTRAL_USERNAME}</username>
                <password>${env.CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          chmod 600 ~/.m2/settings.xml

          mvn -B -f bridges/jvm/release.xml -Pcentral \
            -Ddrift.linux="$work/bin/drift" \
            -Ddrift.windows="$work/bin/drift.exe" \
            deploy
