<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="DRIFT — Behaviour Contract Gate">
  <title>DRIFT — Behaviour Contract Gate</title>
  <defs>
    <!-- Observatory Deck background -->
    <radialGradient id="boardBg" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#1E2328" />
      <stop offset="65%" stop-color="#181B1F" />
      <stop offset="100%" stop-color="#121518" />
    </radialGradient>

    <!-- Dot-matrix pattern from drift-flow-svg -->
    <pattern id="fluxDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.15" fill="#8D9B9B" fill-opacity="0.26" />
    </pattern>

    <!-- Radial mask so dots fade smoothly near squircle edges -->
    <radialGradient id="dotsMaskGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="72%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="94%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <mask id="dotsMask">
      <rect width="512" height="512" fill="url(#dotsMaskGrad)" />
    </mask>

    <!-- Central Verdigris / Mint observatory glow -->
    <radialGradient id="fluxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58DCC3" stop-opacity="0.20" />
      <stop offset="55%" stop-color="#58DCC3" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#58DCC3" stop-opacity="0" />
    </radialGradient>

    <!-- Copper border gradient -->
    <linearGradient id="copperFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A76D" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#CB9367" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#58DCC3" stop-opacity="0.75" />
    </linearGradient>

    <!-- Soft core glow filter with generous bounds -->
    <filter id="coreBloom" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Outer Squircle (Observatory Deck) -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#boardBg)" stroke="url(#copperFrame)" stroke-width="2.5" />
  <rect x="38" y="38" width="436" height="436" rx="80" fill="none" stroke="#383B3D" stroke-width="1" />

  <!-- 2. Dot-Matrix Field & Radial Mint Glow -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="url(#fluxDots)" mask="url(#dotsMask)" />
  <circle cx="256" cy="256" r="196" fill="url(#fluxGlow)">
    <animate attributeName="r" values="184;208;184" dur="4.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.82;1;0.82" dur="4.2s" repeatCount="indefinite" />
  </circle>

  <!-- 3. Cartographic Axes & Registration Crosshairs (+) -->
  <g stroke="#9A9891" stroke-width="1.2" stroke-dasharray="3 11" opacity="0.28">
    <line x1="46" y1="256" x2="466" y2="256" />
    <line x1="256" y1="46" x2="256" y2="466" />
  </g>
  <g stroke="#9FB5AD" stroke-width="1" stroke-dasharray="2 10" opacity="0.20">
    <line x1="92" y1="168" x2="420" y2="168" />
    <line x1="92" y1="344" x2="420" y2="344" />
  </g>
  <!-- Registration crosshairs -->
  <g stroke="#7A948B" stroke-width="1.2" opacity="0.50" stroke-linecap="round">
    <path d="M 116 156 V 168 M 110 162 H 122" />
    <path d="M 396 156 V 168 M 390 162 H 402" />
    <path d="M 116 344 V 356 M 110 350 H 122" />
    <path d="M 396 344 V 356 M 390 350 H 402" />
    <!-- Top and bottom T-ticks -->
    <path d="M 256 426 V 440 M 242 440 H 270" />
    <path d="M 256 86 V 72 M 242 72 H 270" />
  </g>

  <!-- 4. Signal Flow Waves (Left Copper Intent -> Gate -> Right Verdigris Proof) -->
  <!-- Base harmonic carrier -->
  <path d="M 60 256 Q 118 256 148 228 T 192 256 M 320 256 Q 364 284 398 256 T 452 256"
        fill="none" stroke="#9FB5AD" stroke-width="1.5" opacity="0.38" stroke-linecap="round" />

  <!-- Left Copper (WHEN / INPUT) waves -->
  <path id="logoWaveLeft" d="M 68 256 C 106 256, 122 210, 152 224 S 178 256, 192 256"
        fill="none" stroke="#E8A76D" stroke-width="2.6" opacity="0.88" stroke-linecap="round" />
  <path d="M 68 256 C 104 258, 124 300, 154 286 S 178 256, 192 256"
        fill="none" stroke="#E8A76D" stroke-width="2.0" opacity="0.52" stroke-linecap="round" />
  <path d="M 68 256 C 106 256, 122 210, 152 224 S 178 256, 192 256"
        fill="none" stroke="#FFCE8B" stroke-width="3.4" stroke-dasharray="10 38" opacity="0.95" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="144" to="0" dur="2.8s" repeatCount="indefinite" />
  </path>

  <!-- Right Verdigris Mint (THEN / PROOF) waves -->
  <path id="logoWaveRight" d="M 320 256 C 336 256, 352 212, 378 226 S 418 256, 444 256"
        fill="none" stroke="#58DCC3" stroke-width="2.6" opacity="0.92" stroke-linecap="round" />
  <path d="M 320 256 C 338 256, 356 298, 384 286 S 420 256, 444 256"
        fill="none" stroke="#58DCC3" stroke-width="2.0" opacity="0.54" stroke-linecap="round" />
  <path d="M 320 256 C 336 256, 352 212, 378 226 S 418 256, 444 256"
        fill="none" stroke="#74FFE4" stroke-width="3.4" stroke-dasharray="10 38" opacity="0.95" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="144" to="0" dur="2.8s" repeatCount="indefinite" />
  </path>

  <!-- Traveling signal particles along Left & Right waves -->
  <circle r="4.2" fill="#FFCE8B">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 68 256 C 106 256, 122 210, 152 224 S 178 256, 192 256" />
    <animate attributeName="opacity" values="0.2;1;1;0.2" keyTimes="0;0.15;0.85;1" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle r="4.2" fill="#74FFE4">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 320 256 C 336 256, 352 212, 378 226 S 418 256, 444 256" />
    <animate attributeName="opacity" values="0.2;1;1;0.2" keyTimes="0;0.15;0.85;1" dur="2.8s" repeatCount="indefinite" />
  </circle>

  <!-- Wave terminal & inflection nodes -->
  <circle cx="68" cy="256" r="6.5" fill="#E8A76D" />
  <circle cx="152" cy="224" r="3.5" fill="#E8A76D" />
  <circle cx="142" cy="289" r="2.6" fill="#E8A76D" opacity="0.65" />

  <circle cx="444" cy="256" r="6.5" fill="#58DCC3" />
  <circle cx="378" cy="226" r="3.5" fill="#58DCC3" />
  <circle cx="392" cy="285" r="2.6" fill="#58DCC3" opacity="0.80" />

  <!-- 5. Orbital Rings & Satellites -->
  <!-- Outer satellite dashed orbit (continuous rotation) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="32s" repeatCount="indefinite" />
    <circle cx="256" cy="256" r="162" fill="none" stroke="#7A877E" stroke-width="1.4" stroke-dasharray="4 18" opacity="0.58" />
    <circle cx="256" cy="94" r="5" fill="#E8A76D" />
    <circle cx="370" cy="370" r="4.2" fill="#58DCC3" />
  </g>

  <!-- Outer copper ring & cardinal ticks -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="#BC8151" stroke-width="1.8" opacity="0.62" />
  <!-- Inner sage-mint ring -->
  <circle cx="256" cy="256" r="103" fill="none" stroke="#67978C" stroke-width="2.0" opacity="0.68" />
  <!-- 4 Cardinal ticks -->
  <path d="M 256 136 V 118 M 256 394 V 376 M 136 256 H 118 M 394 256 H 376"
        stroke="#E8A76D" stroke-width="2.4" opacity="0.78" stroke-linecap="round" />

  <!-- 6. Double-Nested Rotated 45° Diamond Gate (drift-flux-core-diamond) -->
  <g transform="rotate(45 256 256)">
    <!-- Outer Copper-Framed Diamond -->
    <rect x="184" y="184" width="144" height="144" rx="6" fill="#192220" stroke="#CB9367" stroke-width="3.2" />
    <!-- Inner Verdigris-Framed Diamond -->
    <rect x="206" y="206" width="100" height="100" rx="4" fill="#102926" stroke="#58DCC3" stroke-width="3.6" />
    <!-- Subtle inner precision square -->
    <rect x="228" y="228" width="56" height="56" rx="2" fill="none" stroke="#67978C" stroke-width="1.2" opacity="0.55" />
  </g>

  <!-- 7. Central Sealed Core Node -->
  <circle cx="256" cy="256" r="15" fill="#70F6D9" filter="url(#coreBloom)">
    <animate attributeName="r" values="13.5;16.5;13.5" dur="3.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="256" cy="256" r="5.5" fill="#1C584E" />
</svg>
